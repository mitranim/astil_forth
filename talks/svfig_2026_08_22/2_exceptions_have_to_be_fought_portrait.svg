<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Programs actually fight exceptions</title>
  <desc>
    A resource-management flow. Normal execution locks, works, and unlocks.
    An exception escapes from work and skips cleanup. Try and finally restore
    cleanup by opting out locally. Catch, finally, defer, errdefer, with, and
    using are shown as exception-canceling workarounds.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="bad-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6666" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF6666" stop-opacity=".022"/>
    </linearGradient>
    <linearGradient id="modifier-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FF6666"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8A8F0"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="70" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">Programs actually fight exceptions</text>
  <text x="44" y="102" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">RESOURCE LIFETIME · HIDDEN EXIT · LOCAL OPT-OUT</text>

  <!-- Straight-line source, broken by hidden exit. -->
  <rect x="44" y="134" width="712" height="286" rx="16"
        fill="url(#bad-fill)" stroke="#FF6666" stroke-width="2"/>
  <text x="70" y="173" fill="#FF6666"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">SIMPLE CLEANUP IS INVALID</text>
  <text x="70" y="211" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21">Any operation may escape before cleanup</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="20" font-weight="700" text-anchor="middle">
    <rect x="70" y="258" width="164" height="66" rx="11"
          fill="#A3F5A3" fill-opacity=".08" stroke="#A3F5A3" stroke-width="2"/>
    <text x="152" y="299" fill="#A3F5A3">LOCK</text>

    <path d="M234 291H305" fill="none" stroke="#A3F5A3" stroke-width="2.5"
          marker-end="url(#arrow-green)"/>

    <rect x="316" y="258" width="164" height="66" rx="11"
          fill="#FFFFFF" fill-opacity=".04" stroke="#C3C3B6" stroke-width="2"/>
    <text x="398" y="299" fill="#FFFFFF">WORK</text>

    <path d="M480 291H551" fill="none" stroke="#FF6666" stroke-width="2.5"
          stroke-dasharray="7 7"/>

    <rect x="562" y="258" width="164" height="66" rx="11"
          fill="#FF6666" fill-opacity=".04" stroke="#FF6666" stroke-width="2"
          stroke-dasharray="7 7"/>
    <text x="644" y="299" fill="#C3C3B6">UNLOCK</text>
  </g>

  <path d="M398 324V347Q398 373 426 373H680"
        fill="none" stroke="#FF6666" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="514" y="360" fill="#FF6666"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17" font-weight="700">EXCEPTION ESCAPES</text>
  <path d="M596 266L692 316M692 266L596 316" stroke="#FF6666"
        stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="390" fill="#FF6666"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20" font-weight="700">Cleanup skipped</text>

  <!-- Local opt-out. -->
  <rect x="44" y="448" width="712" height="234" rx="16"
        fill="url(#modifier-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="70" y="487" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">OPT OUT OF EXCEPTIONS LOCALLY</text>
  <text x="70" y="525" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21">Add control flow whose job is restoring cleanup</text>

  <rect x="70" y="556" width="660" height="92" rx="12"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="18" font-weight="700" text-anchor="middle">
    <text x="118" y="607" fill="#A8A8F0">TRY</text>
    <rect x="166" y="572" width="154" height="56" rx="9"
          fill="#FFFFFF" fill-opacity=".04" stroke="#C3C3B6"/>
    <text x="243" y="607" fill="#FFFFFF">WORK</text>
    <path d="M320 600H408" fill="none" stroke="#A8A8F0" stroke-width="2.5"
          marker-end="url(#arrow-purple)"/>
    <text x="465" y="607" fill="#A8A8F0">FINALLY</text>
    <rect x="540" y="572" width="164" height="56" rx="9"
          fill="#A3F5A3" fill-opacity=".08" stroke="#A3F5A3"/>
    <text x="622" y="607" fill="#A3F5A3">UNLOCK</text>
  </g>

  <!-- Vocabulary growth. -->
  <rect x="44" y="710" width="712" height="150" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="70" y="749" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">EXCEPTION-CANCELING WORKAROUNDS</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="18" font-weight="700" text-anchor="middle">
    <rect x="70" y="777" width="98" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="119" y="808" fill="#A8A8F0">catch</text>
    <rect x="179" y="777" width="104" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="231" y="808" fill="#A8A8F0">finally</text>
    <rect x="294" y="777" width="98" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="343" y="808" fill="#A8A8F0">defer</text>
    <rect x="403" y="777" width="112" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="459" y="808" fill="#A8A8F0">errdefer</text>
    <rect x="526" y="777" width="88" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="570" y="808" fill="#A8A8F0">with</text>
    <rect x="625" y="777" width="105" height="48" rx="9" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="677.5" y="808" fill="#A8A8F0">using</text>
  </g>

  <!-- Conclusion. -->
  <text x="295" y="910" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="18" font-weight="700">OPT IN</text>
  <path d="M367 904H431" fill="none" stroke="#FF6666" stroke-width="2.5"
        marker-end="url(#arrow-red)"/>
  <text x="503" y="910" fill="#FF6666" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="18" font-weight="700">OPT OUT</text>
  <text x="400" y="962" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">All this machinery to cancel the feature!</text>
</svg>
