<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Plain return; granular handling</title>
  <desc>
    A fallible function always returns values and an ordinary trailing error;
    sample outputs out0, out1, and err map directly to Arm64 x0, x1, and x2.
    Each function locally chooses fully explicit handling, explicit try and
    throw shortcuts through a trailing Err output, or automatic forwarding
    through a trailing lowercase err output. Success needs no explicit nil,
    throw is a local return with no unwinder, and catch is unnecessary.
  </desc>

  <defs>
    <linearGradient id="rail-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="explicit-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".055"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="shortcut-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="auto-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="69" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">Plain return; granular handling</text>
  <text x="44" y="101" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">ONE RETURN SHAPE · THREE LOCAL GRANULARITIES</text>

  <!-- Shared return contract. -->
  <rect x="44" y="130" width="712" height="126" rx="15"
        fill="url(#rail-fill)" stroke="#66FFE6" stroke-width="2"/>
  <text x="70" y="160" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">FUNCTION OUTPUTS · ERROR IS LAST</text>
  <foreignObject x="194" y="171" width="412" height="42">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;text-align:center;color:#C3C3B6;font:700 25px/34px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span>{ </span><span style="color:#D2DFF9;font-style:italic">inp</span><span> … -- </span><span style="color:#D2DFF9;font-style:italic">out0</span><span> </span><span style="color:#D2DFF9;font-style:italic">out1</span><span> </span><span style="color:#A8A8F0;font-style:italic">err</span><span> }</span></pre>
    </div>
  </foreignObject>
  <g stroke="#4D4D4D" stroke-width="1.5">
    <path d="M263 211V220"/>
    <path d="M400 211V220"/>
    <path d="M467 211V220"/>
    <path d="M543 211V220"/>
  </g>
  <text x="70" y="239" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">ARM64 REGISTERS</text>
  <g fill="#FFFFFF" text-anchor="middle"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="15" font-weight="700">
    <text x="263" y="239">x0</text>
    <text x="400" y="239">x0</text>
    <text x="467" y="239">x1</text>
    <text x="543" y="239" fill="#66FFE6">x2</text>
  </g>

  <!-- Three symmetric local choices. -->
  <text x="44" y="304" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">EACH FUNCTION CHOOSES</text>

  <rect x="44" y="324" width="220" height="252" rx="15"
        fill="url(#explicit-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="66" y="359" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">EXPLICIT HANDLING</text>
  <text x="66" y="402" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">Total visibility</text>
  <line x1="66" y1="425" x2="242" y2="425" stroke="#4D4D4D" stroke-width="2"/>
  <text x="66" y="462" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Bind error</text>
  <text x="66" y="498" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Ordinary flow</text>
  <text x="66" y="534" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Total local control</text>

  <rect x="290" y="324" width="220" height="252" rx="15"
        fill="url(#shortcut-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="312" y="359" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">TRAILING <tspan fill="#D2DFF9" font-style="italic">Err</tspan></text>
  <text x="312" y="402" fill="#A8A8F0"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">Local shortcuts</text>
  <line x1="312" y1="425" x2="488" y2="425" stroke="#4D4D4D" stroke-width="2"/>
  <text x="312" y="469" fill="#A3F5A3"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="22" font-weight="700">try · throw</text>
  <text x="312" y="512" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Explicit forwarding</text>
  <text x="312" y="548" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16" font-weight="700">Happy path stays short</text>

  <rect x="536" y="324" width="220" height="252" rx="15"
        fill="url(#auto-fill)" stroke="#A3F5A3" stroke-width="2"/>
  <text x="558" y="359" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">TRAILING <tspan fill="#D2DFF9" font-style="italic">err</tspan></text>
  <text x="558" y="402" fill="#A3F5A3"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">Opt-in auto-try</text>
  <line x1="558" y1="425" x2="734" y2="425" stroke="#4D4D4D" stroke-width="2"/>
  <text x="558" y="462" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Auto-forwarding</text>
  <text x="558" y="498" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Errors stay declared</text>
  <text x="558" y="534" fill="#A3F5A3"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">Noise disappears</text>

  <!-- Granularity progression. -->
  <text x="154" y="619" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">FULLY EXPLICIT</text>
  <path d="M244 613H310" fill="none" stroke="#C3C3B6" stroke-width="2"
        marker-end="url(#arrow)"/>
  <text x="400" y="619" fill="#A8A8F0" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">LOCALLY SHORTENED</text>
  <path d="M490 613H556" fill="none" stroke="#C3C3B6" stroke-width="2"
        marker-end="url(#arrow)"/>
  <text x="646" y="619" fill="#A3F5A3" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">LOCALLY AUTOMATIC</text>

  <!-- Removed noise and machinery. -->
  <rect x="44" y="650" width="712" height="166" rx="15"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="70" y="685" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">LESS NOISE · LESS MACHINERY</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <line x1="274" y1="708" x2="274" y2="790" stroke="#4D4D4D" stroke-width="2"/>
    <line x1="526" y1="708" x2="526" y2="790" stroke="#4D4D4D" stroke-width="2"/>

    <text x="70" y="740" fill="#FFFFFF" font-size="19" font-weight="700">Success</text>
    <text x="70" y="772" fill="#FFFFFF" font-size="18" font-weight="700">No <tspan fill="#66FFE6" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">nil</tspan> needed</text>

    <text x="302" y="740" fill="#A3F5A3"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
          font-size="19" font-weight="700">throw</text>
    <text x="302" y="772" fill="#FFFFFF" font-size="17" font-weight="700">Local return · no unwinder</text>

    <text x="554" y="740" fill="#FFFFFF" font-size="19" font-weight="700">No <tspan fill="#A3F5A3" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">catch</tspan> needed</text>
    <text x="554" y="772" fill="#FFFFFF" font-size="17" font-weight="700">Simply skip <tspan fill="#A3F5A3" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">try</tspan></text>
  </g>

  <!-- Inside / outside distinction. -->
  <rect x="44" y="844" width="712" height="100" rx="15"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="400" y="882" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20" font-weight="700"><tspan fill="#D2DFF9" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-style="italic">Err</tspan><tspan fill="#C3C3B6" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">|</tspan><tspan fill="#D2DFF9" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-style="italic">err</tspan><tspan>: identical external API and ABI</tspan></text>
  <text x="400" y="918" fill="#A3F5A3" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Lowercase <tspan fill="#D2DFF9" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-style="italic">err</tspan>: auto-<tspan font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">try</tspan> only inside this function</text>

  <text x="400" y="980" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Errors remain ordinary outputs at every granularity</text>
</svg>
