<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Exceptions have to be fought</title>
  <desc>
    A resource-management flow. An exception escapes from work and skips
    cleanup. Try and finally restore cleanup by opting out locally. Catch,
    finally, defer, errdefer, with, and using accumulate as workarounds.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="bad-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6666" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF6666" stop-opacity=".022"/>
    </linearGradient>
    <linearGradient id="modifier-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FF6666"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8A8F0"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="64" y="68" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">Exceptions have to be fought</text>
  <text x="64" y="103" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">RESOURCE LIFETIME · HIDDEN EXIT · LOCAL OPT-OUT</text>

  <!-- Straight-line source, broken by hidden exit. -->
  <rect x="64" y="145" width="820" height="250" rx="16"
        fill="url(#bad-fill)" stroke="#FF6666" stroke-width="2"/>
  <text x="92" y="181" fill="#FF6666"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">SIMPLE CLEANUP IS INVALID</text>
  <text x="92" y="215" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20">Any operation may escape before cleanup</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="19" font-weight="700" text-anchor="middle">
    <rect x="92" y="245" width="150" height="62" rx="10"
          fill="#A3F5A3" fill-opacity=".08" stroke="#A3F5A3" stroke-width="2"/>
    <text x="167" y="284" fill="#A3F5A3">LOCK</text>

    <path d="M242 276H324" fill="none" stroke="#A3F5A3" stroke-width="2.5"
          marker-end="url(#arrow-green)"/>

    <rect x="336" y="245" width="150" height="62" rx="10"
          fill="#FFFFFF" fill-opacity=".04" stroke="#C3C3B6" stroke-width="2"/>
    <text x="411" y="284" fill="#FFFFFF">WORK</text>

    <path d="M486 276H568" fill="none" stroke="#FF6666" stroke-width="2.5"
          stroke-dasharray="7 7"/>

    <rect x="580" y="245" width="200" height="62" rx="10"
          fill="#FF6666" fill-opacity=".04" stroke="#FF6666" stroke-width="2"
          stroke-dasharray="7 7"/>
    <text x="680" y="284" fill="#C3C3B6">UNLOCK</text>
  </g>

  <path d="M411 307V329Q411 355 439 355H812"
        fill="none" stroke="#FF6666" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="560" y="344" fill="#FF6666"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700">EXCEPTION ESCAPES</text>
  <path d="M622 252L738 300M738 252L622 300" stroke="#FF6666"
        stroke-width="4" stroke-linecap="round"/>
  <text x="92" y="374" fill="#FF6666"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">Cleanup skipped</text>

  <!-- Compact workaround vocabulary. -->
  <rect x="916" y="145" width="300" height="458" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="944" y="181" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">EXCEPTION-CANCELING WORKAROUNDS</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="16" font-weight="700" text-anchor="middle">
    <rect x="944" y="207" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="236" fill="#A8A8F0">catch</text>
    <rect x="944" y="265" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="294" fill="#A8A8F0">finally</text>

    <rect x="944" y="323" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="352" fill="#A8A8F0">defer</text>
    <rect x="944" y="381" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="410" fill="#A8A8F0">errdefer</text>

    <rect x="944" y="439" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="468" fill="#A8A8F0">with</text>
    <rect x="944" y="497" width="244" height="46" rx="8" fill="#A8A8F0" fill-opacity=".10"/>
    <text x="1066" y="526" fill="#A8A8F0">using</text>
  </g>

  <!-- Local opt-out. -->
  <rect x="64" y="423" width="820" height="180" rx="16"
        fill="url(#modifier-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="92" y="459" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">OPT OUT OF EXCEPTIONS LOCALLY</text>
  <text x="92" y="493" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20">Add control flow whose job is restoring cleanup</text>

  <rect x="92" y="516" width="764" height="60" rx="10"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="18" font-weight="700" text-anchor="middle">
    <text x="140" y="553" fill="#A8A8F0">TRY</text>
    <rect x="196" y="526" width="150" height="40" rx="8"
          fill="#FFFFFF" fill-opacity=".04" stroke="#C3C3B6"/>
    <text x="271" y="553" fill="#FFFFFF">WORK</text>
    <path d="M346 546H488" fill="none" stroke="#A8A8F0" stroke-width="2.5"
          marker-end="url(#arrow-purple)"/>
    <text x="560" y="553" fill="#A8A8F0">FINALLY</text>
    <rect x="650" y="526" width="178" height="40" rx="8"
          fill="#A3F5A3" fill-opacity=".08" stroke="#A3F5A3"/>
    <text x="739" y="553" fill="#A3F5A3">UNLOCK</text>
  </g>

  <line x1="64" y1="628" x2="1216" y2="628" stroke="#333333" stroke-width="2"/>
  <text x="514" y="661" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17" font-weight="700">OPT IN</text>
  <path d="M568 655H648" fill="none" stroke="#FF6666" stroke-width="2.5"
        marker-end="url(#arrow-red)"/>
  <text x="714" y="661" fill="#FF6666" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17" font-weight="700">OPT OUT</text>
  <text x="640" y="700" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21" font-weight="700">All this machinery to cancel the feature!</text>
</svg>
