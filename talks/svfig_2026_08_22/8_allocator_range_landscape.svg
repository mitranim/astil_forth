<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Powerful allocator interface: [top,ceil)</title>
  <desc>
    A contiguous memory arena exposes base, saved_top, top, and ceil. Three
    operations follow directly: bump top to allocate, subtract top from ceil
    to query capacity, and restore saved_top to bulk-rewind. A final strip
    contrasts this visible range with malloc and free hiding the allocator.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".012"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="44" y="55" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">Powerful allocator interface: <tspan fill="#A8A8F0" font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">[top,ceil)</tspan></text>
  <text x="44" y="87" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">BUMP · CAPACITY · REWIND</text>

  <!-- The allocator is the visible range itself. -->
  <rect x="44" y="110" width="1192" height="246" rx="14"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="142" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CONTIGUOUS MEMORY ARENA</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="15" font-weight="700">
    <text x="70" y="179" fill="#C3C3B6">base</text>
    <text x="390" y="179" fill="#A8A8F0" text-anchor="middle">saved_top</text>
    <text x="790" y="179" fill="#66FFE6" text-anchor="middle">top</text>
    <text x="1210" y="179" fill="#A3F5A3" text-anchor="end">ceil</text>
  </g>
  <text x="1210" y="198" fill="#C3C3B6" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="13">explicit budget</text>

  <g stroke-width="2">
    <path d="M70 185V207" stroke="#4D4D4D"/>
    <path d="M390 185V207" stroke="#A8A8F0"/>
    <path d="M790 185V207" stroke="#66FFE6"/>
    <path d="M1210 185V207" stroke="#A3F5A3"/>
  </g>

  <rect x="70" y="207" width="320" height="74"
        fill="#FFFFFF" fill-opacity=".035" stroke="#4D4D4D" stroke-width="2"/>
  <rect x="390" y="207" width="400" height="74"
        fill="#A8A8F0" fill-opacity=".12" stroke="#A8A8F0" stroke-width="2"/>
  <rect x="790" y="207" width="420" height="74"
        fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3" stroke-width="2"/>

  <g text-anchor="middle"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     font-size="18" font-weight="700">
    <text x="230" y="252" fill="#FFFFFF">Prior objects</text>
    <text x="590" y="252" fill="#A8A8F0">Temporary objects</text>
    <text x="1000" y="252" fill="#A3F5A3">Remaining capacity</text>
  </g>

  <path d="M790 300V312M790 306H1210M1210 300V312"
        fill="none" stroke="#A3F5A3" stroke-width="2"/>
  <text x="1000" y="337" fill="#A3F5A3" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="18" font-weight="700">ceil - top</text>
  <text x="770" y="337" fill="#FFFFFF" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">entire remaining capacity</text>

  <!-- Three powers derived from the visible range. -->
  <rect x="44" y="372" width="384" height="168" rx="10"
        fill="#181A1B" stroke="#66FFE6" stroke-width="2"/>
  <text x="68" y="404" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">BUMP ALLOCATE</text>
  <foreignObject x="68" y="424" width="336" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;text-align:center;color:#FFFFFF;font:700 18px/28px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace">obj <span style="color:#A3F5A3">=</span> top
top <span style="color:#A3F5A3">+=</span> size</pre>
    </div>
  </foreignObject>
  <text x="236" y="505" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17" font-weight="700">Claim addresses directly</text>
  <text x="236" y="529" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15">No object metadata</text>

  <rect x="448" y="372" width="384" height="168" rx="10"
        fill="#181A1B" stroke="#A3F5A3" stroke-width="2"/>
  <text x="472" y="404" fill="#A3F5A3"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">ASK CAPACITY</text>
  <foreignObject x="472" y="432" width="336" height="38">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;text-align:center;color:#FFFFFF;font:700 18px/28px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace">cap <span style="color:#A3F5A3">=</span> ceil <span style="color:#A3F5A3">-</span> top</pre>
    </div>
  </foreignObject>
  <text x="640" y="505" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17" font-weight="700">Use whole remainder</text>
  <text x="640" y="529" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15">No size declared upfront</text>

  <rect x="852" y="372" width="384" height="168" rx="10"
        fill="#181A1B" stroke="#A8A8F0" stroke-width="2"/>
  <text x="876" y="404" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">BULK REWIND</text>
  <foreignObject x="876" y="432" width="336" height="38">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;text-align:center;color:#FFFFFF;font:700 18px/28px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace">top <span style="color:#A3F5A3">=</span> saved_top</pre>
    </div>
  </foreignObject>
  <text x="1044" y="505" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17" font-weight="700">Discard temporary objects</text>
  <text x="1044" y="529" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15">No per-object free</text>

  <!-- Adversarial comparison, visibly outside the allocator interface. -->
  <rect x="44" y="556" width="1192" height="92" rx="14"
        fill="#FF3333" fill-opacity=".04" stroke="#FF6666" stroke-width="2"/>
  <text x="68" y="588" fill="#FF6666"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CRITIQUE · MALLOC / FREE</text>
  <text x="68" y="620" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">hides the allocator</text>
  <line x1="328" y1="572" x2="328" y2="632" stroke="#4D4D4D" stroke-width="2"/>
  <line x1="630" y1="572" x2="630" y2="632" stroke="#4D4D4D" stroke-width="2"/>
  <line x1="932" y1="572" x2="932" y2="632" stroke="#4D4D4D" stroke-width="2"/>
  <g fill="#FFFFFF" text-anchor="middle"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     font-size="17" font-weight="700">
    <text x="479" y="596">Size demanded</text>
    <text x="479" y="622">upfront</text>
    <text x="781" y="596">Remaining capacity</text>
    <text x="781" y="622">hidden</text>
    <text x="1084" y="596">Objects freed</text>
    <text x="1084" y="622">individually</text>
  </g>

  <rect x="44" y="664" width="1192" height="44" rx="12"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="640" y="693" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Less abstraction · more visible power</text>
</svg>
