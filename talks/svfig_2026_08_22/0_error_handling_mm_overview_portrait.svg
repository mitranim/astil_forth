<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Error handling design; memory-management corollaries</title>
  <desc>
    High-level talk overview: learn from other languages, rethink error handling
    from first principles, balance a simple ABI with local ergonomics,
    and follow informative errors into ambient region-based memory management.
  </desc>

  <defs>
    <linearGradient id="error-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".15"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="survey-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="memory-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="48" y="73" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="35" font-weight="700">Error handling design;</text>
  <text x="48" y="115" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="35" font-weight="700">memory-management corollaries</text>
  <text x="48" y="145" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">EXPLORE → EXTRACT → REBUILD</text>

  <rect x="48" y="180" width="704" height="153" rx="16"
        fill="url(#survey-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="78" y="219" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">01 / PRIOR LANGUAGE DESIGNS</text>
  <text x="78" y="267" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="29" font-weight="700">Learn from prior successes and mistakes</text>
  <text x="78" y="298" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">Error returns · exceptions · hybrids</text>
  <text x="720" y="298" fill="#FF6666" text-anchor="end"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">WHAT TO AVOID 😛</text>

  <path d="M400 333V365" fill="none" stroke="#A8A8F0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="48" y="377" width="704" height="153" rx="16"
        fill="#FFFFFF" fill-opacity=".03" stroke="#4D4D4D" stroke-width="2"/>
  <text x="78" y="416" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">02 / DESIRED PROPERTIES</text>
  <text x="78" y="464" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="29" font-weight="700">Rethink error handling from first principles</text>
  <text x="78" y="495" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">Simple · ergonomic · interoperable</text>

  <path d="M400 530V562" fill="none" stroke="#A3F5A3" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="48" y="574" width="704" height="177" rx="16"
        fill="url(#error-fill)" stroke="#A3F5A3" stroke-width="2"/>
  <text x="78" y="613" fill="#A3F5A3"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">03 / ALTERNATIVE DESIGN</text>
  <text x="78" y="670" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="29" font-weight="700">Plain error outputs with local shortcuts</text>
  <text x="78" y="711" fill="#A3F5A3"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">INTEROPERABLE ABI · LOCAL GRANULARITY</text>

  <path d="M400 751V783" fill="none" stroke="#66FFE6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="48" y="795" width="704" height="137" rx="16"
        fill="url(#memory-fill)" stroke="#66FFE6" stroke-width="2"/>
  <text x="78" y="834" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">04 / MEMORY-MANAGEMENT COROLLARIES</text>
  <text x="78" y="881" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="28" font-weight="700">Ambient allocators; powers of region-MM</text>
  <text x="78" y="911" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Dynamic and static values · memory lifetime · bulk rewind · threads</text>

  <text x="400" y="977" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Error handling design influences entire language and MM</text>
</svg>
