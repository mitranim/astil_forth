<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Each thread carries an ambient program context</title>
  <desc>
    Inside one thread, an outer function calls an inner function and then a
    deeper function which needs dynamic memory for objects, strings, or byte
    buffers. Instead of passing an allocator through the call chain, the deep
    function obtains the current context through the code word context. The
    context has a fixed allocator header containing self, top, and ceil, plus a
    program-defined tail. A scoped with_ctx block temporarily replaces the
    current context and restores the previous context when the block ends. A
    footnote compares this with Forth task-local USER storage while noting the
    additional control and simple public ABI.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".012"/>
    </linearGradient>
    <linearGradient id="context-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="tail-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="64" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="31" font-weight="700">Each thread carries an ambient program context</text>
  <text x="44" y="97" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">DEEP-CALL ALLOCATION · NO ALLOCATOR ARGUMENT CHAIN</text>

  <!-- One thread: generic call depth reaches ambient state at point of use. -->
  <rect x="44" y="126" width="712" height="522" rx="15"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="160" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">ONE THREAD · PER-THREAD, NOT GLOBAL</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     text-anchor="middle">
    <rect x="68" y="184" width="250" height="54" rx="10"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="193" y="218" fill="#FFFFFF" font-size="19" font-weight="700">Outer function</text>

    <path d="M193 238V256" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="68" y="264" width="250" height="54" rx="10"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="193" y="298" fill="#FFFFFF" font-size="19" font-weight="700">Inner function</text>

    <path d="M193 318V336" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="68" y="344" width="250" height="54" rx="10"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="193" y="378" fill="#FFFFFF" font-size="19" font-weight="700">Deeper function</text>

    <path d="M193 398V416" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="68" y="424" width="250" height="112" rx="12"
          fill="#A3F5A3" fill-opacity=".055" stroke="#A3F5A3" stroke-width="2"/>
    <text x="193" y="458" fill="#A3F5A3" font-size="18" font-weight="700">Needs dynamic memory</text>
    <text x="193" y="491" fill="#FFFFFF" font-size="16">objects · strings</text>
    <text x="193" y="516" fill="#FFFFFF" font-size="16">byte buffers · …</text>
  </g>

  <!-- The code word bridges the deep call to the ambient context. -->
  <path d="M318 480C354 480 372 398 430 330" fill="none"
        stroke="#A3F5A3" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="326" y="408" width="96" height="38" rx="8"
        fill="#181A1B" stroke="#A3F5A3" stroke-width="1.5"/>
  <text x="374" y="433" fill="#A3F5A3" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700">context</text>

  <!-- Fixed allocator prefix plus arbitrary public program state. -->
  <rect x="430" y="184" width="302" height="352" rx="14"
        fill="url(#context-fill)" stroke="#66FFE6" stroke-width="2"/>
  <text x="452" y="219" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CURRENT CONTEXT</text>

  <!-- Every field advances in one direction through linear struct memory. -->
  <rect x="452" y="240" width="258" height="108"
        fill="#181A1B" stroke="#66FFE6" stroke-width="1.5"/>
  <rect x="452" y="348" width="258" height="144"
        fill="url(#tail-fill)" stroke="#A8A8F0" stroke-width="1.5"/>
  <line x1="596" y1="240" x2="596" y2="492" stroke="#4D4D4D" stroke-width="1.5"/>
  <g stroke="#4D4D4D" stroke-width="1.25">
    <line x1="452" y1="276" x2="596" y2="276"/>
    <line x1="452" y1="312" x2="596" y2="312"/>
    <line x1="452" y1="384" x2="596" y2="384"/>
    <line x1="452" y1="420" x2="596" y2="420"/>
    <line x1="452" y1="456" x2="596" y2="456"/>
  </g>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="16" font-weight="700">
    <text x="474" y="264" fill="#FFFFFF">self</text>
    <text x="474" y="300" fill="#66FFE6">top</text>
    <text x="474" y="336" fill="#A3F5A3">ceil</text>
    <text x="474" y="372" fill="#FFFFFF">logger</text>
    <text x="474" y="408" fill="#FFFFFF">request</text>
    <text x="474" y="444" fill="#FFFFFF">caches</text>
    <text x="474" y="480" fill="#C3C3B6">…</text>
  </g>

  <g text-anchor="middle"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="11" font-weight="700">
    <text x="653" y="279" fill="#66FFE6">FIXED</text>
    <text x="653" y="297" fill="#66FFE6">ALLOCATOR</text>
    <text x="653" y="315" fill="#66FFE6">HEADER</text>
    <text x="653" y="407" fill="#A8A8F0">PROGRAM</text>
    <text x="653" y="425" fill="#A8A8F0">DEFINED</text>
    <text x="653" y="443" fill="#A8A8F0">TAIL</text>
  </g>
  <text x="581" y="520" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">LINEAR MEMORY ↓</text>

  <text x="400" y="619" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">No allocator parameter passed through the call chain</text>

  <!-- A real code-shaped scoped override and its visible state transition. -->
  <rect x="44" y="680" width="712" height="222" rx="15"
        fill="#181A1B" stroke="#A8A8F0" stroke-width="2"/>
  <text x="68" y="715" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">SCOPED OVERRIDE</text>
  <line x1="418" y1="736" x2="418" y2="878" stroke="#4D4D4D" stroke-width="2"/>

  <foreignObject x="68" y="750" width="320" height="118">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:22px/35px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace">some_ctx <span style="color:#A3F5A3">.with_ctx</span>
  <span style="color:#A3F5A3">.inner_func</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <text x="448" y="756" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">CURRENT CONTEXT</text>
  <line x1="462" y1="779" x2="462" y2="858" stroke="#4D4D4D" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     font-size="16" font-weight="700">
    <circle cx="462" cy="786" r="4" fill="#C3C3B6"/>
    <text x="480" y="792" fill="#C3C3B6">before</text>
    <text x="546" y="792" fill="#FFFFFF"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">previous</text>

    <circle cx="462" cy="824" r="4" fill="#A3F5A3"/>
    <text x="480" y="830" fill="#A3F5A3">inside</text>
    <text x="540" y="830" fill="#FFFFFF"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">some_ctx</text>

    <circle cx="462" cy="862" r="4" fill="#C3C3B6"/>
    <text x="480" y="868" fill="#C3C3B6">after</text>
    <text x="531" y="868" fill="#FFFFFF"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">previous</text>
  </g>

  <rect x="44" y="916" width="712" height="68" rx="15"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="400" y="943" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Available anywhere · overridable locally · owned per thread</text>
  <text x="400" y="970" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="13">Like Forth task-local <tspan font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">USER</tspan> — more control; simple public ABI</text>
</svg>
