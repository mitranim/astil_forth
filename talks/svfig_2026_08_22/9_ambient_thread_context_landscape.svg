<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Each thread carries an ambient program context</title>
  <desc>
    Within one thread, ordinary calls reach a deeper function that needs
    dynamic memory. The function reads the current context at the point of
    use instead of receiving an allocator through every call. The context is
    a linear structure with a fixed allocator header and program-defined tail.
    A scoped override temporarily replaces and then restores the context.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".012"/>
    </linearGradient>
    <linearGradient id="context-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="tail-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#C3C3B6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#A3F5A3"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="44" y="55" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">Each thread carries an ambient program context</text>
  <text x="44" y="87" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">DEEP-CALL ALLOCATION · NO ALLOCATOR ARGUMENT CHAIN</text>

  <!-- One thread: call flow and ambient state use full-width horizontal bands. -->
  <rect x="44" y="110" width="1192" height="318" rx="14"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="142" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">ONE THREAD · PER-THREAD, NOT GLOBAL</text>

  <!-- Ordinary call chain. -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     text-anchor="middle">
    <rect x="68" y="158" width="180" height="64" rx="9"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="158" y="197" fill="#FFFFFF" font-size="18" font-weight="700">Outer function</text>

    <path d="M248 190H273" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="274" y="158" width="180" height="64" rx="9"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="364" y="197" fill="#FFFFFF" font-size="18" font-weight="700">Inner function</text>

    <path d="M454 190H479" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="480" y="158" width="180" height="64" rx="9"
          fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
    <text x="570" y="197" fill="#FFFFFF" font-size="18" font-weight="700">Deeper function</text>

    <path d="M660 190H685" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="686" y="158" width="526" height="64" rx="9"
          fill="#A3F5A3" fill-opacity=".055" stroke="#A3F5A3" stroke-width="2"/>
    <text x="949" y="184" fill="#A3F5A3" font-size="18" font-weight="700">Needs dynamic memory</text>
    <text x="949" y="208" fill="#FFFFFF" font-size="15">objects · strings · byte buffers · …</text>
  </g>

  <!-- Ambient channel spans every call depth without becoming an argument. -->
  <rect x="68" y="238" width="1144" height="40" rx="8"
        fill="#A3F5A3" fill-opacity=".035" stroke="#A3F5A3" stroke-width="1.5"/>
  <text x="92" y="264" fill="#FFFFFF"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700">context</text>
  <line x1="196" y1="247" x2="196" y2="269" stroke="#4D4D4D" stroke-width="1.5"/>
  <text x="220" y="264" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17" font-weight="700">Ambient at every call depth · no allocator parameter passed</text>

  <!-- Current context is one linear structure in memory. -->
  <text x="68" y="303" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">CURRENT CONTEXT</text>
  <text x="1212" y="303" fill="#C3C3B6" text-anchor="end"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">LINEAR MEMORY →</text>

  <g stroke-width="1.5">
    <rect x="68" y="312" width="130" height="60" fill="#181A1B" stroke="#66FFE6"/>
    <rect x="198" y="312" width="130" height="60" fill="#181A1B" stroke="#66FFE6"/>
    <rect x="328" y="312" width="130" height="60" fill="#181A1B" stroke="#66FFE6"/>
    <rect x="458" y="312" width="180" height="60" fill="url(#tail-fill)" stroke="#A8A8F0"/>
    <rect x="638" y="312" width="180" height="60" fill="url(#tail-fill)" stroke="#A8A8F0"/>
    <rect x="818" y="312" width="180" height="60" fill="url(#tail-fill)" stroke="#A8A8F0"/>
    <rect x="998" y="312" width="214" height="60" fill="url(#tail-fill)" stroke="#A8A8F0"/>
  </g>
  <g text-anchor="middle"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="17" font-weight="700">
    <text x="133" y="349" fill="#FFFFFF">self</text>
    <text x="263" y="349" fill="#FFFFFF">top</text>
    <text x="393" y="349" fill="#FFFFFF">ceil</text>
    <text x="548" y="349" fill="#FFFFFF">logger</text>
    <text x="728" y="349" fill="#FFFFFF">request</text>
    <text x="908" y="349" fill="#FFFFFF">caches</text>
    <text x="1105" y="349" fill="#C3C3B6">…</text>
  </g>

  <g text-anchor="middle"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
     font-size="12" font-weight="700">
    <text x="263" y="400" fill="#66FFE6">FIXED ALLOCATOR HEADER</text>
    <text x="835" y="400" fill="#A8A8F0">PROGRAM-DEFINED TAIL</text>
  </g>

  <!-- Scoped override: code and resulting state transition. -->
  <rect x="44" y="444" width="1192" height="184" rx="14"
        fill="#181A1B" stroke="#A8A8F0" stroke-width="2"/>
  <text x="68" y="476" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">SCOPED OVERRIDE</text>
  <line x1="560" y1="464" x2="560" y2="610" stroke="#4D4D4D" stroke-width="2"/>

  <foreignObject x="68" y="494" width="456" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:20px/32px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace">some_ctx <span style="color:#A3F5A3">.with_ctx</span>
  <span style="color:#A3F5A3">.inner_func</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <text x="590" y="476" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">CURRENT CONTEXT</text>
  <g text-anchor="middle"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <text x="665" y="506" fill="#C3C3B6" font-size="12" font-weight="700">BEFORE</text>
    <text x="890" y="506" fill="#A3F5A3" font-size="12" font-weight="700">INSIDE</text>
    <text x="1115" y="506" fill="#C3C3B6" font-size="12" font-weight="700">AFTER</text>

    <rect x="590" y="516" width="150" height="50" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
    <text x="665" y="548" fill="#FFFFFF" font-size="16" font-weight="700">previous</text>

    <path d="M740 541H814" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="815" y="516" width="150" height="50" rx="8"
          fill="#A3F5A3" fill-opacity=".055" stroke="#A3F5A3" stroke-width="2"/>
    <text x="890" y="548" fill="#FFFFFF" font-size="16" font-weight="700">some_ctx</text>

    <path d="M965 541H1039" fill="none" stroke="#C3C3B6" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="1040" y="516" width="150" height="50" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
    <text x="1115" y="548" fill="#FFFFFF" font-size="16" font-weight="700">previous</text>
  </g>
  <text x="890" y="598" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16" font-weight="700">Temporary replacement · automatic restore</text>

  <rect x="44" y="644" width="1192" height="64" rx="14"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="640" y="674" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Available anywhere · overridable locally · owned per thread</text>
  <text x="640" y="698" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="13">Like Forth task-local <tspan font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">USER</tspan> — more control; simple public ABI</text>
</svg>
