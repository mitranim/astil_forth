<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Stack effects directly map to register states</title>
  <desc>
    Five lines show register states after the source words 10, 20, 30,
    multiply, and add. Live registers are cyan. Values left above the current
    stack depth remain visible in gray.
  </desc>

  <defs>
    <linearGradient id="live-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="68" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="36" font-weight="700">
    <tspan x="44" dy="0">Stack effects directly map</tspan>
    <tspan x="44" dy="43">to register states</tspan>
  </text>

  <rect x="44" y="143" width="712" height="58" rx="8"
        fill="#FFFFFF" fill-opacity=".045" stroke="#333333"/>
  <text x="400" y="179" fill="#FFFFFF" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17">
    <tspan fill="#A3F5A3">fun</tspan><tspan fill="#A8A8F0">:</tspan>
    <tspan fill="#D2DFF9" font-style="italic"> .some_word</tspan><tspan fill="#C3C3B6"> { -- </tspan><tspan fill="#D2DFF9" font-style="italic">out</tspan><tspan fill="#C3C3B6"> } </tspan>
    <tspan fill="#66FFE6">10 20 30</tspan>
    <tspan fill="#A3F5A3"> * +</tspan>
    <tspan fill="#A3F5A3"> end</tspan>
  </text>

  <!-- One source word and its resulting state per line. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- 10 -->
    <g transform="translate(0 240)">
      <rect x="44" y="0" width="74" height="78" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="81" y="48" fill="#66FFE6" text-anchor="middle"
            font-size="23" font-weight="700">10</text>
      <path d="M132 39H162" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="180" y="0" width="180" height="78" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <text x="198" y="47" fill="#C3C3B6" font-size="17">x0</text>
      <text x="338" y="47" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
    </g>

    <!-- 20 -->
    <g transform="translate(0 356)">
      <rect x="44" y="0" width="74" height="78" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="81" y="48" fill="#66FFE6" text-anchor="middle"
            font-size="23" font-weight="700">20</text>
      <path d="M132 39H162" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="180" y="0" width="360" height="78" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="360" y1="1" x2="360" y2="77" stroke="#66FFE6" stroke-opacity=".55"/>
      <text x="198" y="47" fill="#C3C3B6" font-size="17">x0</text>
      <text x="338" y="47" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="378" y="47" fill="#C3C3B6" font-size="17">x1</text>
      <text x="518" y="47" fill="#66FFE6" text-anchor="end" font-size="23">20</text>
    </g>

    <!-- 30 -->
    <g transform="translate(0 472)">
      <rect x="44" y="0" width="74" height="78" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="81" y="48" fill="#66FFE6" text-anchor="middle"
            font-size="23" font-weight="700">30</text>
      <path d="M132 39H162" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="180" y="0" width="540" height="78" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="360" y1="1" x2="360" y2="77" stroke="#66FFE6" stroke-opacity=".55"/>
      <line x1="540" y1="1" x2="540" y2="77" stroke="#66FFE6" stroke-opacity=".55"/>
      <text x="198" y="47" fill="#C3C3B6" font-size="17">x0</text>
      <text x="338" y="47" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="378" y="47" fill="#C3C3B6" font-size="17">x1</text>
      <text x="518" y="47" fill="#66FFE6" text-anchor="end" font-size="23">20</text>
      <text x="558" y="47" fill="#C3C3B6" font-size="17">x2</text>
      <text x="698" y="47" fill="#66FFE6" text-anchor="end" font-size="23">30</text>
    </g>

    <!-- multiply -->
    <g transform="translate(0 588)">
      <rect x="44" y="0" width="74" height="78" rx="9"
            fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3"/>
      <text x="81" y="49" fill="#A3F5A3" text-anchor="middle"
            font-size="27" font-weight="700">*</text>
      <path d="M132 39H162" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="180" y="0" width="360" height="78" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="360" y1="1" x2="360" y2="77" stroke="#66FFE6" stroke-opacity=".55"/>
      <rect x="550" y="0" width="170" height="78" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <text x="198" y="47" fill="#C3C3B6" font-size="17">x0</text>
      <text x="338" y="47" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="378" y="47" fill="#C3C3B6" font-size="17">x1</text>
      <text x="518" y="47" fill="#66FFE6" text-anchor="end" font-size="23">600</text>
      <text x="568" y="47" fill="#666666" font-size="17">x2</text>
      <text x="698" y="47" fill="#777777" text-anchor="end" font-size="23">30</text>
    </g>

    <!-- add -->
    <g transform="translate(0 704)">
      <rect x="44" y="0" width="74" height="78" rx="9"
            fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3"/>
      <text x="81" y="49" fill="#A3F5A3" text-anchor="middle"
            font-size="27" font-weight="700">+</text>
      <path d="M132 39H162" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="180" y="0" width="180" height="78" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <rect x="370" y="0" width="170" height="78" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <rect x="550" y="0" width="170" height="78" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <text x="198" y="47" fill="#C3C3B6" font-size="17">x0</text>
      <text x="338" y="47" fill="#66FFE6" text-anchor="end" font-size="23">610</text>
      <text x="388" y="47" fill="#666666" font-size="17">x1</text>
      <text x="518" y="47" fill="#777777" text-anchor="end" font-size="23">600</text>
      <text x="568" y="47" fill="#666666" font-size="17">x2</text>
      <text x="698" y="47" fill="#777777" text-anchor="end" font-size="23">30</text>
    </g>
  </g>

  <circle cx="52" cy="850" r="6" fill="#66FFE6"/>
  <text x="72" y="857" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">live register stack</text>

  <circle cx="52" cy="893" r="6" fill="#777777"/>
  <text x="72" y="900" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">physical values above current depth</text>

  <text x="400" y="963" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19">
    word → resulting state
  </text>
</svg>
