<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Hardware-rotated vs fixed-address register stacks</title>
  <desc>
    Portrait comparison. GreenArrays has explicit T and S registers above eight
    circularly addressed stack registers; instructions implicitly operate on stack
    positions. Astil Forth uses eighteen fixed-address Arm64 registers from x0
    through x17; instructions explicitly address registers.
  </desc>

  <defs>
    <linearGradient id="ga-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="astil-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".015"/>
    </linearGradient>
    <marker id="ga-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="astil-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#66FFE6"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <!-- Title -->
  <text x="56" y="88" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="31" font-weight="700">Hardware-rotated vs fixed-address</text>
  <text x="56" y="124" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="31" font-weight="700">register stacks</text>

  <!-- GreenArrays panel -->
  <rect x="56" y="166" width="688" height="360" rx="16"
        fill="url(#ga-glow)" stroke="#333333" stroke-width="2"/>

  <text x="90" y="207" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">GREENARRAYS F18A</text>
  <text x="90" y="248" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="28" font-weight="700">Hardware rotates under the stack</text>

  <!-- T and S -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     text-anchor="middle">
    <rect x="90" y="276" width="108" height="58" rx="8"
          fill="#A3F5A3" fill-opacity=".18" stroke="#A3F5A3" stroke-width="2"/>
    <rect x="210" y="276" width="108" height="58" rx="8"
          fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3" stroke-width="2"/>
    <text x="144" y="302" fill="#FFFFFF" font-size="22" font-weight="700">T</text>
    <text x="144" y="323" fill="#C3C3B6" font-size="13">top</text>
    <text x="264" y="302" fill="#FFFFFF" font-size="22" font-weight="700">S</text>
    <text x="264" y="323" fill="#C3C3B6" font-size="13">second</text>
  </g>
  <text x="346" y="300" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18">+</text>
  <text x="370" y="300" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">uses S,T</text>
  <text x="346" y="326" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">no register fields</text>

  <!-- Eight-register circular stack -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="14" text-anchor="middle">
    <rect x="90" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".10"
          stroke="#A3F5A3" stroke-opacity=".70"/>
    <rect x="151" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".08"
          stroke="#A3F5A3" stroke-opacity=".65"/>
    <rect x="212" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".07"
          stroke="#A3F5A3" stroke-opacity=".60"/>
    <rect x="273" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".06"
          stroke="#A3F5A3" stroke-opacity=".55"/>
    <rect x="334" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".06"
          stroke="#A3F5A3" stroke-opacity=".55"/>
    <rect x="395" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".50"/>
    <rect x="456" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".50"/>
    <rect x="517" y="360" width="55" height="44" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".50"/>
    <text x="117.5" y="387" fill="#FFFFFF">0</text>
    <text x="178.5" y="387" fill="#FFFFFF">1</text>
    <text x="239.5" y="387" fill="#FFFFFF">2</text>
    <text x="300.5" y="387" fill="#FFFFFF">3</text>
    <text x="361.5" y="387" fill="#FFFFFF">4</text>
    <text x="422.5" y="387" fill="#FFFFFF">5</text>
    <text x="483.5" y="387" fill="#FFFFFF">6</text>
    <text x="544.5" y="387" fill="#FFFFFF">7</text>
  </g>
  <path d="M106 426 C106 454 556 454 556 426" fill="none"
        stroke="#A3F5A3" stroke-width="2" marker-end="url(#ga-arrow)"/>
  <text x="331" y="464" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">8 circularly addressed registers</text>

  <line x1="90" y1="484" x2="710" y2="484" stroke="#333333" stroke-width="2"/>
  <text x="90" y="512" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Runtime words: arbitrary stack effects</text>

  <!-- Astil panel -->
  <rect x="56" y="550" width="688" height="370" rx="16"
        fill="url(#astil-glow)" stroke="#333333" stroke-width="2"/>

  <text x="90" y="591" fill="#66FFE6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">ASTIL FORTH / ARM64</text>
  <text x="90" y="632" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="28" font-weight="700">Compiler tracks fixed registers</text>

  <!-- Fixed register strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="16" text-anchor="middle">
    <rect x="90" y="658" width="94" height="60" rx="8"
          fill="#66FFE6" fill-opacity=".18" stroke="#66FFE6" stroke-width="2"/>
    <rect x="192" y="658" width="94" height="60" rx="8"
          fill="#66FFE6" fill-opacity=".14" stroke="#66FFE6" stroke-width="2"/>
    <rect x="294" y="658" width="94" height="60" rx="8"
          fill="#66FFE6" fill-opacity=".11" stroke="#66FFE6" stroke-width="2"/>
    <rect x="396" y="658" width="94" height="60" rx="8"
          fill="#66FFE6" fill-opacity=".08" stroke="#66FFE6" stroke-opacity=".7" stroke-width="2"/>
    <rect x="498" y="658" width="152" height="60" rx="8"
          fill="#66FFE6" fill-opacity=".05" stroke="#66FFE6" stroke-opacity=".55" stroke-width="2"/>
    <text x="137" y="694" fill="#FFFFFF">x0</text>
    <text x="239" y="694" fill="#FFFFFF">x1</text>
    <text x="341" y="694" fill="#FFFFFF">x2</text>
    <text x="443" y="694" fill="#C3C3B6">x3</text>
    <text x="574" y="694" fill="#C3C3B6">… x17</text>
  </g>

  <path d="M341 728 L341 748" fill="none" stroke="#66FFE6"
        stroke-width="2" marker-end="url(#astil-arrow)"/>
  <rect x="90" y="756" width="620" height="60" rx="9" fill="#FFFFFF" fill-opacity=".06"/>
  <text x="400" y="794" fill="#FFFFFF" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22">
    <tspan fill="#A3F5A3">add</tspan>
    <tspan> x2, x2, x3</tspan>
  </text>
  <text x="400" y="836" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">register numbers encoded in every instruction</text>

  <line x1="90" y1="850" x2="710" y2="850" stroke="#333333" stroke-width="2"/>
  <circle cx="98" cy="875" r="5" fill="#66FFE6"/>
  <text x="116" y="882" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Runtime words: consume + replace full stack</text>
  <circle cx="98" cy="904" r="5" fill="#A3F5A3"/>
  <text x="116" y="911" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Comptime words: operate on top values</text>

  <!-- Takeaway -->
  <line x1="56" y1="950" x2="744" y2="950" stroke="#333333" stroke-width="2"/>
  <text x="400" y="980" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16">hardware hides register numbers · software exposes them</text>
</svg>
