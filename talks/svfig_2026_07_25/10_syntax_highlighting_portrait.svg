<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Semantic roles require distinct syntactic roles</title>
  <desc>
    A real Astil Forth HTTP server excerpt rendered with the exact semantic
    colors and styles of the Role Dark Sublime Text scheme. Value-like names
    are plain white, call-like names are green, declared names are pale blue
    italic, punctuation and modifiers are purple or muted, constants are cyan,
    and the word consumed by instr apostrophe has the raw-string background.
    A four-part key explains noun, verb, declaration, and parsing roles.
  </desc>

  <defs>
    <linearGradient id="key-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="64" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="32" font-weight="700">
    Semantic roles require distinct syntactic roles
  </text>

  <text x="44" y="108" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14">EXCERPT · examples/http_echo.af</text>

  <!--
    Exact Role Dark rendering for a standalone .af buffer:
      bg             hsl(200, 5%, 10%)
      fg             white
      action_fg      hsl(120, 80%, 80%)
      modifier_fg    hsl(240, 70%, 80%)
      declaration_fg hsl(220, 75%, 90%), italic
      const_fg       hsl(170, 100%, 70%)
      raw_fg         hsl(60, 50%, 95%)
      raw_bg         white at 6% alpha
      comment_fg     hsl(60, 10%, 74%)
  -->

  <!-- Native HTML inline layout: pre owns whitespace; spans own highlighting. -->
  <foreignObject x="44" y="126" width="712" height="252">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:18px/28px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.run</span> <span style="color:#C3C3B6">{ -- </span><span style="color:#A8A8F0;font-style:italic">err</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#A8A8F0">"</span><span style="color:#F9F9E5;background:rgba(255,255,255,.06)"> 2345</span><span style="color:#A8A8F0">"</span>                  <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">port</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#66FFE6">128</span>                      <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">backlog</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#A3F5A3">instr</span><span style="color:#A8A8F0">'</span> <span style="color:#F9F9E5;background:rgba(255,255,255,.06)">.handle_conn</span>      <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">handler</span><span style="color:#C3C3B6"> }</span>
  port backlog <span style="color:#A3F5A3">.net_listen</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">sock</span><span style="color:#C3C3B6"> }</span>

  <span style="color:#A8A8F0">"</span><span style="color:#F9F9E5;background:rgba(255,255,255,.06)"> [srv] listening on http://localhost:%s\n</span><span style="color:#A8A8F0">"</span> port <span style="color:#A3F5A3">.elogf</span>
  sock handler <span style="color:#A3F5A3">.net_accept_loop_threaded</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <line x1="44" y1="410" x2="756" y2="410" stroke="#4D4D4D" stroke-width="2"/>

  <text x="44" y="454"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">
    <tspan fill="#FFFFFF">SEMANTIC ROLE</tspan>
    <tspan fill="#C3C3B6"> → </tspan>
    <tspan fill="#D2DFF9">SPELLING</tspan>
    <tspan fill="#C3C3B6"> → </tspan>
    <tspan fill="#A3F5A3">HIGHLIGHTING</tspan>
  </text>

  <!-- Semantic key; outside exact source rendering. -->
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <!-- Noun. -->
    <rect x="44" y="480" width="340" height="145" rx="13"
          fill="url(#key-fill)" stroke="#4D4D4D" stroke-width="2"/>
    <text x="68" y="518" fill="#C3C3B6" font-size="14" font-weight="700">NOUN · VALUE</text>
    <text x="68" y="562" fill="#FFFFFF" font-size="22">port</text>
    <text x="68" y="594" fill="#C3C3B6" font-size="14">value-like identifier</text>

    <!-- Verb. -->
    <rect x="416" y="480" width="340" height="145" rx="13"
          fill="url(#key-fill)" stroke="#4D4D4D" stroke-width="2"/>
    <text x="440" y="518" fill="#C3C3B6" font-size="14" font-weight="700">VERB · CALL</text>
    <text x="440" y="562" fill="#A3F5A3" font-size="22">.net_listen</text>
    <text x="440" y="594" fill="#C3C3B6" font-size="14">call-like spelling</text>

    <!-- Declaration. -->
    <rect x="44" y="650" width="340" height="145" rx="13"
          fill="url(#key-fill)" stroke="#4D4D4D" stroke-width="2"/>
    <text x="68" y="688" fill="#C3C3B6" font-size="14" font-weight="700">DECLARATION · SUFFIX :</text>
    <text x="68" y="732" font-size="22">
      <tspan fill="#A3F5A3">fun</tspan><tspan fill="#A8A8F0">:</tspan>
      <tspan fill="#D2DFF9" font-style="italic"> .run</tspan>
    </text>
    <text x="68" y="764" fill="#C3C3B6" font-size="14">next word is declared</text>

    <!-- Parser. -->
    <rect x="416" y="650" width="340" height="145" rx="13"
          fill="url(#key-fill)" stroke="#4D4D4D" stroke-width="2"/>
    <text x="440" y="688" fill="#C3C3B6" font-size="14" font-weight="700">PARSER · SUFFIX '</text>
    <foreignObject x="440" y="706" width="292" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml">
        <pre style="margin:0;color:#FFFFFF;font:20px/32px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">instr</span><span style="color:#A8A8F0">'</span> <span style="color:#F9F9E5;background:rgba(255,255,255,.06)">.handle_conn</span></pre>
      </div>
    </foreignObject>
    <text x="440" y="764" fill="#C3C3B6" font-size="14">next word is parsed as data</text>
  </g>

  <text x="400" y="918" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">
    <tspan fill="#A3F5A3" font-weight="700">PURE RENAMING</tspan>
    <tspan fill="#C3C3B6"> — no compiler changes; any Forth can adopt this</tspan>
  </text>
</svg>
