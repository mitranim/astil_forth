<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Runtime calls reset register state; local stack code stays direct</title>
  <desc>
    Landscape summary of the register-stack restriction and its tradeoffs.
    Arithmetic and memory operations edit selected register slots directly.
    Runtime and foreign calls replace the entire register stack with their
    outputs. Removing that boundary requires either a more complex compiler or
    hidden memory traffic. Keeping it buys compile-time arity checking, simple
    code generation, strong performance, and source portable to stack machines.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="direct-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="call-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="choice-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8A8F0"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="62" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">
    Runtime calls reset register state; local stack code stays direct
  </text>

  <!-- Scope of the restriction. -->
  <rect x="48" y="92" width="568" height="530" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="126" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">WHERE THE RESTRICTION APPLIES</text>

  <!-- Local comptime edit. -->
  <rect x="72" y="146" width="520" height="198" rx="13"
        fill="url(#direct-fill)" stroke="#66FFE6" stroke-width="2"/>
  <text x="94" y="178" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">LOCAL COMPTIME EDIT</text>
  <text x="94" y="205" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">Arithmetic · load · store</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(94 224)">
      <rect width="198" height="62" rx="9" fill="url(#direct-fill)"
            stroke="#66FFE6"/>
      <path d="M66 0V62M132 0V62" stroke="#66FFE6"/>
      <text x="33" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
      <text x="99" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
      <text x="165" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x2</text>
      <text x="33" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">keep</text>
      <text x="99" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">a</text>
      <text x="165" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">b</text>
    </g>

    <path d="M292 255H380" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="336" cy="255" r="23" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="336" y="264" fill="#A3F5A3" text-anchor="middle"
          font-size="29" font-weight="700">+</text>

    <g transform="translate(388 224)">
      <rect width="178" height="62" rx="9" fill="url(#direct-fill)"
            stroke="#66FFE6"/>
      <path d="M89 0V62" stroke="#66FFE6"/>
      <text x="44.5" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
      <text x="133.5" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
      <text x="44.5" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">keep</text>
      <text x="133.5" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">a+b</text>
    </g>
  </g>
  <text x="332" y="320" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12">selected slots · no hidden memory</text>

  <!-- Runtime call boundary. -->
  <rect x="72" y="364" width="520" height="232" rx="13"
        fill="url(#call-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="94" y="396" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">RUNTIME / FOREIGN CALL</text>
  <text x="94" y="423" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">Outputs replace whole register stack</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(94 446)">
      <rect width="178" height="62" rx="9" fill="url(#direct-fill)"
            stroke="#66FFE6"/>
      <path d="M59.33 0V62M118.67 0V62" stroke="#66FFE6"/>
      <text x="29.67" y="37" fill="#FFFFFF" text-anchor="middle" font-size="14">x0</text>
      <text x="89" y="37" fill="#FFFFFF" text-anchor="middle" font-size="14">x1</text>
      <text x="148.33" y="37" fill="#FFFFFF" text-anchor="middle" font-size="14">x2</text>
    </g>

    <path d="M272 477H310" fill="none" stroke="#A8A8F0"
          stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="318" y="449" width="78" height="56" rx="10"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0" stroke-width="2"/>
    <text x="357" y="483" fill="#A3F5A3" text-anchor="middle" font-size="16">.call</text>
    <path d="M396 477H418" fill="none" stroke="#A8A8F0"
          stroke-width="2" marker-end="url(#arrow-purple)"/>

    <g transform="translate(426 446)">
      <rect width="140" height="62" rx="9" fill="url(#call-fill)"
            stroke="#A8A8F0"/>
      <path d="M70 0V62" stroke="#A8A8F0"/>
      <text x="35" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
      <text x="105" y="24" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
      <text x="35" y="47" fill="#FFFFFF" text-anchor="middle" font-size="13">out0</text>
      <text x="105" y="47" fill="#FFFFFF" text-anchor="middle" font-size="13">out1</text>
    </g>
  </g>

  <text x="332" y="540" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12">every prior cell is dead after the call</text>
  <text x="332" y="570" fill="#A8A8F0" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13" font-weight="700">RESTRICTION STAYS</text>

  <!-- Deliberate tradeoff. -->
  <rect x="664" y="92" width="568" height="250" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="692" y="126" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">REMOVING THE BOUNDARY REQUIRES</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="688" y="148" width="226" height="112" rx="11"
          fill="#FF3333" fill-opacity=".035" stroke="#FF6666"/>
    <text x="801" y="184" fill="#FFFFFF" text-anchor="middle"
          font-size="18" font-weight="700">More complex compiler</text>
    <text x="801" y="214" fill="#C3C3B6" text-anchor="middle" font-size="14">track live values across</text>
    <text x="801" y="235" fill="#C3C3B6" text-anchor="middle" font-size="14">opaque calls</text>

    <text x="948" y="211" fill="#C3C3B6" text-anchor="middle"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
          font-size="15">OR</text>

    <rect x="982" y="148" width="226" height="112" rx="11"
          fill="#FF3333" fill-opacity=".035" stroke="#FF6666"/>
    <text x="1095" y="184" fill="#FFFFFF" text-anchor="middle"
          font-size="18" font-weight="700">Hidden memory traffic</text>
    <text x="1095" y="214" fill="#C3C3B6" text-anchor="middle" font-size="14">spill and reconstruct</text>
    <text x="1095" y="235" fill="#C3C3B6" text-anchor="middle" font-size="14">stack state</text>
  </g>

  <rect x="688" y="280" width="520" height="40" rx="8"
        fill="url(#choice-fill)" stroke="#A3F5A3"/>
  <text x="948" y="306" fill="#A3F5A3" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CHOICE · KEEP THE EXPLICIT CALL BOUNDARY</text>

  <!-- Lessons. -->
  <rect x="664" y="362" width="568" height="260" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="692" y="396" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">WHAT THE RESTRICTION BUYS</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="700" cy="438" r="5" fill="#A3F5A3"/>
    <text x="718" y="436" fill="#FFFFFF" font-size="17" font-weight="700">Arity known at comptime</text>
    <text x="718" y="459" fill="#C3C3B6" font-size="14">mistakes are checked</text>

    <circle cx="974" cy="438" r="5" fill="#66FFE6"/>
    <text x="992" y="436" fill="#FFFFFF" font-size="17" font-weight="700">Direct numbered registers</text>
    <text x="992" y="459" fill="#C3C3B6" font-size="14">simple code generation</text>

    <circle cx="700" cy="514" r="5" fill="#A8A8F0"/>
    <text x="718" y="512" fill="#FFFFFF" font-size="17" font-weight="700">Near-Clang benchmark speed</text>
    <text x="718" y="535" fill="#C3C3B6" font-size="14">small, imperfect compiler</text>

    <circle cx="974" cy="514" r="5" fill="#C3C3B6"/>
    <text x="992" y="512" fill="#FFFFFF" font-size="17" font-weight="700">Portable stack source</text>
    <text x="992" y="535" fill="#C3C3B6" font-size="14">valid on full stack machines</text>
  </g>

  <line x1="692" y1="566" x2="1204" y2="566" stroke="#4D4D4D"/>
  <text x="948" y="594" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">Small restriction; arithmetic stays direct and I/O barely changes</text>

  <line x1="48" y1="652" x2="1232" y2="652" stroke="#333333" stroke-width="2"/>
  <text x="640" y="687" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="20" font-weight="700">
    Don’t force an abstract stack machine; map language state to CPU state
  </text>
</svg>
