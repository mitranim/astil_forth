<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Branches may push or consume; joins require equal output arity</title>
  <desc>
    Two conditional examples from the talk. The left conditional pushes two
    values in either branch and joins with A and B in x0 and x1. The right
    conditional starts with three values, consumes them through arithmetic,
    and joins with one output in x0. Each branch may transform the stack
    differently, but both sides must reach the same output arity.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="join-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="62" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">
    Branches may push or consume; joins require equal output arity
  </text>

  <!-- Left: conditional expression. -->
  <rect x="48" y="92" width="568" height="530" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="126" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CONDITIONAL EXPRESSION · PUSHES TWO VALUES</text>

  <rect x="76" y="143" width="512" height="86" rx="10"
        fill="#000000" fill-opacity=".16" stroke="#4D4D4D"/>
  <foreignObject x="96" y="153" width="472" height="68">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:14px/21px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.mock</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">cond</span><span style="color:#C3C3B6"> -- </span><span style="color:#D2DFF9;font-style:italic">A B</span><span style="color:#C3C3B6"> }</span>
  cond <span style="color:#A3F5A3">.then</span> <span style="color:#66FFE6">10 20</span> <span style="color:#A3F5A3">else</span> <span style="color:#66FFE6">30 40</span> <span style="color:#A3F5A3">end</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <rect x="282" y="250" width="100" height="44" rx="22"
        fill="#FFFFFF" fill-opacity=".025" stroke="#C3C3B6" stroke-width="1.5"/>
  <text x="332" y="278" fill="#FFFFFF" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17">cond</text>

  <path d="M307 294L194 331" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M357 294L470 331" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="76" y="324" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">TRUE</text>
  <text x="356" y="324" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">FALSE</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(76 336)">
      <rect width="236" height="70" rx="10" fill="url(#state-fill)"
            stroke="#66FFE6" stroke-width="2"/>
      <path d="M118 0V70" stroke="#66FFE6"/>
      <text x="59" y="35" fill="#66FFE6" text-anchor="middle" font-size="21">10</text>
      <text x="59" y="57" fill="#C3C3B6" text-anchor="middle" font-size="11">x0 · A</text>
      <text x="177" y="35" fill="#66FFE6" text-anchor="middle" font-size="21">20</text>
      <text x="177" y="57" fill="#C3C3B6" text-anchor="middle" font-size="11">x1 · B</text>
    </g>
    <g transform="translate(352 336)">
      <rect width="236" height="70" rx="10" fill="url(#state-fill)"
            stroke="#66FFE6" stroke-width="2"/>
      <path d="M118 0V70" stroke="#66FFE6"/>
      <text x="59" y="35" fill="#66FFE6" text-anchor="middle" font-size="21">30</text>
      <text x="59" y="57" fill="#C3C3B6" text-anchor="middle" font-size="11">x0 · A</text>
      <text x="177" y="35" fill="#66FFE6" text-anchor="middle" font-size="21">40</text>
      <text x="177" y="57" fill="#C3C3B6" text-anchor="middle" font-size="11">x1 · B</text>
    </g>
  </g>

  <path d="M194 406V426L320 443" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M470 406V426L344 443" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="332" cy="443" r="5" fill="#A3F5A3"/>
  <text x="350" y="470" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">JOIN · 2 CELLS</text>
  <path d="M332 448V478" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect x="196" y="488" width="128" height="58" rx="9"
          fill="url(#join-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <rect x="340" y="488" width="128" height="58" rx="9"
          fill="url(#join-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <text x="260" y="516" fill="#FFFFFF" text-anchor="middle" font-size="18">A</text>
    <text x="260" y="536" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
    <text x="404" y="516" fill="#FFFFFF" text-anchor="middle" font-size="18">B</text>
    <text x="404" y="536" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
  </g>

  <!-- Right: each branch transforms an existing stack. -->
  <rect x="664" y="92" width="568" height="530" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="692" y="126" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">STACK TRANSFORM · CONSUMES THREE VALUES</text>

  <rect x="692" y="143" width="512" height="86" rx="10"
        fill="#000000" fill-opacity=".16" stroke="#4D4D4D"/>
  <foreignObject x="712" y="153" width="472" height="68">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:14px/21px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.mock</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">cond</span><span style="color:#C3C3B6"> -- </span><span style="color:#D2DFF9;font-style:italic">out</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#66FFE6">10 20 30</span>  cond <span style="color:#A3F5A3">.then + - else * - end</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <text x="948" y="253" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">ENTRY STACK</text>
  <g transform="translate(812 264)"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect width="272" height="60" rx="9" fill="url(#state-fill)"
          stroke="#66FFE6" stroke-width="2"/>
    <path d="M90.67 0V60M181.33 0V60" stroke="#66FFE6"/>
    <text x="45.33" y="29" fill="#66FFE6" text-anchor="middle" font-size="19">10</text>
    <text x="45.33" y="49" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
    <text x="136" y="29" fill="#66FFE6" text-anchor="middle" font-size="19">20</text>
    <text x="136" y="49" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
    <text x="226.67" y="29" fill="#66FFE6" text-anchor="middle" font-size="19">30</text>
    <text x="226.67" y="49" fill="#C3C3B6" text-anchor="middle" font-size="10">x2</text>
  </g>

  <path d="M920 324V337L726 356" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M976 324V334H680V426H714L726 440" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <text x="692" y="386" fill="#C3C3B6" font-size="12" font-weight="700">TRUE</text>
    <g transform="translate(726 348)">
      <rect width="150" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M50 0V58M100 0V58" stroke="#66FFE6"/>
      <text x="25" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="75" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="125" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
    </g>
    <path d="M876 377H930" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="902" cy="377" r="22" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="902" y="385" fill="#A3F5A3" text-anchor="middle"
          font-size="27" font-weight="700">+</text>
    <g transform="translate(936 348)">
      <rect width="108" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M54 0V58" stroke="#66FFE6"/>
      <text x="27" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="81" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">50</text>
    </g>
    <path d="M1044 377H1098" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="1072" cy="377" r="22" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="1072" y="385" fill="#A3F5A3" text-anchor="middle"
          font-size="27" font-weight="700">−</text>
    <rect x="1104" y="348" width="98" height="58" rx="9"
          fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="1153" y="374" fill="#66FFE6" text-anchor="middle" font-size="18">−40</text>
    <text x="1153" y="395" fill="#C3C3B6" text-anchor="middle" font-size="10">x0 · out</text>

    <text x="692" y="478" fill="#C3C3B6" font-size="12" font-weight="700">FALSE</text>
    <g transform="translate(726 440)">
      <rect width="150" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M50 0V58M100 0V58" stroke="#66FFE6"/>
      <text x="25" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="75" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="125" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
    </g>
    <path d="M876 469H930" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="902" cy="469" r="22" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="902" y="478" fill="#A3F5A3" text-anchor="middle"
          font-size="27" font-weight="700">×</text>
    <g transform="translate(936 440)">
      <rect width="108" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M54 0V58" stroke="#66FFE6"/>
      <text x="27" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="81" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">600</text>
    </g>
    <path d="M1044 469H1098" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="1072" cy="469" r="22" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="1072" y="477" fill="#A3F5A3" text-anchor="middle"
          font-size="27" font-weight="700">−</text>
    <rect x="1104" y="440" width="98" height="58" rx="9"
          fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="1153" y="466" fill="#66FFE6" text-anchor="middle" font-size="18">−590</text>
    <text x="1153" y="487" fill="#C3C3B6" text-anchor="middle" font-size="10">x0 · out</text>
  </g>

  <path d="M1202 377H1214" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M1202 469H1214" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M1214 377V536H960" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="948" cy="536" r="5" fill="#A3F5A3"/>
  <text x="968" y="557" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">JOIN · 1 CELL</text>
  <path d="M948 541V556" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect x="900" y="566" width="96" height="44" rx="8"
          fill="url(#join-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <text x="948" y="586" fill="#FFFFFF" text-anchor="middle" font-size="16">out</text>
    <text x="948" y="602" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
  </g>

  <line x1="48" y1="652" x2="1232" y2="652" stroke="#333333" stroke-width="2"/>
  <text x="640" y="687" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17">
    Branch bodies may differ; only joined stack shape must agree
  </text>
</svg>
