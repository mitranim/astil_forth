<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Redesigning Forth for two different readers</title>
  <desc>
    800 by 1000 talk roadmap for a narrow browser window. First, stack-style programming
    maps directly to Arm64 registers with compile-time optimization. After a hard
    topic change, plain-ASCII spelling and syntax colors expose semantic roles.
  </desc>

  <defs>
    <linearGradient id="cpu-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="human-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".015"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <g transform="translate(8.870968 0) scale(1.008064516)">

  <!-- Title -->
  <text x="48" y="88" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">Redesigning Forth</text>
  <text x="48" y="124" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">for two different readers</text>

  <!-- Topic 1 -->
  <rect x="48" y="166" width="680" height="310" rx="16"
        fill="url(#cpu-glow)" stroke="#333333" stroke-width="2"/>

  <text x="82" y="207" fill="#66FFE6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">01 / THE CPU</text>
  <text x="82" y="249" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="30" font-weight="700">Stack code → Arm64</text>
  <text x="82" y="280" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Numbered registers become the stack.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="17" text-anchor="middle">
    <rect x="82" y="306" width="84" height="52" rx="7" fill="#66FFE6" fill-opacity=".16"
          stroke="#66FFE6" stroke-width="2"/>
    <rect x="174" y="306" width="84" height="52" rx="7" fill="#66FFE6" fill-opacity=".16"
          stroke="#66FFE6" stroke-width="2"/>
    <rect x="266" y="306" width="84" height="52" rx="7" fill="#66FFE6" fill-opacity=".16"
          stroke="#66FFE6" stroke-width="2"/>
    <rect x="358" y="306" width="84" height="52" rx="7" fill="#66FFE6" fill-opacity=".07"
          stroke="#66FFE6" stroke-opacity=".55" stroke-width="2"/>
    <rect x="450" y="306" width="142" height="52" rx="7" fill="#66FFE6" fill-opacity=".07"
          stroke="#66FFE6" stroke-opacity=".55" stroke-width="2"/>
    <text x="124" y="338" fill="#FFFFFF">x0</text>
    <text x="216" y="338" fill="#FFFFFF">x1</text>
    <text x="308" y="338" fill="#FFFFFF">x2</text>
    <text x="400" y="338" fill="#C3C3B6">x3</text>
    <text x="521" y="338" fill="#C3C3B6">… x17</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">
    <circle cx="90" cy="386" r="5" fill="#A3F5A3"/>
    <text x="108" y="393" fill="#FFFFFF">comptime register stack</text>
    <circle cx="90" cy="420" r="5" fill="#A3F5A3"/>
    <text x="108" y="427" fill="#FFFFFF">constant folding + instruction fusion</text>
    <circle cx="90" cy="454" r="5" fill="#A3F5A3"/>
    <text x="108" y="461" fill="#FFFFFF">simple compiler; concrete machine</text>
  </g>

  <!-- Hard topic cut -->
  <line x1="48" y1="505" x2="728" y2="505"
        stroke="#4D4D4D" stroke-width="2" stroke-dasharray="7 10"/>
  <rect x="360" y="480" width="56" height="50" rx="25"
        fill="#181A1B" stroke="#4D4D4D" stroke-width="2"/>
  <path d="M375 497 L388 511 L401 497" fill="none" stroke="#FFFFFF"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Topic 2 -->
  <rect x="48" y="548" width="680" height="354" rx="16"
        fill="url(#human-glow)" stroke="#333333" stroke-width="2"/>

  <text x="82" y="589" fill="#A8A8F0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">02 / THE HUMAN</text>
  <text x="82" y="631" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="30" font-weight="700">Meaning → visible syntax</text>
  <text x="82" y="662" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Plain ASCII already contains semantic roles.</text>

  <!-- Syntax sample -->
  <rect x="82" y="687" width="612" height="108" rx="9" fill="#FFFFFF" fill-opacity=".06"/>
  <foreignObject x="108" y="699" width="560" height="88">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:18px/28px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">some_word</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">value</span><span style="color:#C3C3B6"> -- </span><span style="color:#D2DFF9;font-style:italic">out</span><span style="color:#C3C3B6"> }</span>
  value <span style="color:#A3F5A3">.transform</span> <span style="color:#66FFE6">2</span> <span style="color:#A3F5A3">*</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <!-- Role key -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">
    <circle cx="90" cy="833" r="5" fill="#FFFFFF"/>
    <text x="108" y="840" fill="#FFFFFF">value-like noun</text>

    <circle cx="364" cy="833" r="5" fill="#A3F5A3"/>
    <text x="382" y="840" fill="#FFFFFF">call-like action</text>

    <circle cx="90" cy="870" r="5" fill="#D2DFF9"/>
    <text x="108" y="877" fill="#FFFFFF">declared name</text>

    <circle cx="364" cy="870" r="5" fill="#66FFE6"/>
    <text x="382" y="877" fill="#FFFFFF">numeric literal</text>
  </g>

  <!-- Footer -->
  <line x1="48" y1="937" x2="728" y2="937" stroke="#333333" stroke-width="2"/>
  <text x="388" y="970" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17">hardware first · readability second</text>
  </g>
</svg>
