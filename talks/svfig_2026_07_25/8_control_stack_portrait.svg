<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Branches may push or consume; joins require equal output arity</title>
  <desc>
    Two conditional examples from the talk. The first pushes two values in
    either branch and joins with A and B in x0 and x1. The second starts with
    three values, consumes them through arithmetic, and joins with one output
    in x0. Action words and operators are green; numeric literals and concrete
    stack values are cyan.
  </desc>

  <defs>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="58" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="24" font-weight="700">
    Branches may push or consume; joins require equal output arity
  </text>

  <!-- Example 1: the conditional itself supplies two output values. -->
  <rect x="44" y="86" width="712" height="384" rx="14"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="118" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">CONDITIONAL EXPRESSION · PUSHES TWO VALUES</text>

  <rect x="68" y="136" width="664" height="70" rx="10"
        fill="#000000" fill-opacity=".16" stroke="#4D4D4D"/>
  <foreignObject x="88" y="140" width="620" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:15px/21px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.mock</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">cond</span><span style="color:#C3C3B6"> -- </span><span style="color:#D2DFF9;font-style:italic">A B</span><span style="color:#C3C3B6"> }</span>
  cond <span style="color:#A3F5A3">.then</span> <span style="color:#66FFE6">10 20</span> <span style="color:#A3F5A3">else</span> <span style="color:#66FFE6">30 40</span> <span style="color:#A3F5A3">end</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <rect x="350" y="222" width="100" height="44" rx="22"
        fill="#FFFFFF" fill-opacity=".025" stroke="#C3C3B6" stroke-width="1.5"/>
  <text x="400" y="250" fill="#FFFFFF" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="17">cond</text>

  <path d="M375 266L228 300" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M425 266L572 300" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="204" y="292" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">TRUE</text>
  <text x="548" y="292" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">FALSE</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(96 306)">
      <rect width="264" height="68" rx="10" fill="url(#state-fill)"
            stroke="#66FFE6" stroke-width="2"/>
      <path d="M132 0V68" stroke="#66FFE6"/>
      <text x="66" y="34" fill="#66FFE6" text-anchor="middle" font-size="22">10</text>
      <text x="66" y="56" fill="#C3C3B6" text-anchor="middle" font-size="11">x0 · A</text>
      <text x="198" y="34" fill="#66FFE6" text-anchor="middle" font-size="22">20</text>
      <text x="198" y="56" fill="#C3C3B6" text-anchor="middle" font-size="11">x1 · B</text>
    </g>
    <g transform="translate(440 306)">
      <rect width="264" height="68" rx="10" fill="url(#state-fill)"
            stroke="#66FFE6" stroke-width="2"/>
      <path d="M132 0V68" stroke="#66FFE6"/>
      <text x="66" y="34" fill="#66FFE6" text-anchor="middle" font-size="22">30</text>
      <text x="66" y="56" fill="#C3C3B6" text-anchor="middle" font-size="11">x0 · A</text>
      <text x="198" y="34" fill="#66FFE6" text-anchor="middle" font-size="22">40</text>
      <text x="198" y="56" fill="#C3C3B6" text-anchor="middle" font-size="11">x1 · B</text>
    </g>
  </g>

  <path d="M228 374V385L388 393" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M572 374V385L412 393" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="400" cy="393" r="5" fill="#A3F5A3"/>
  <path d="M400 398V407" stroke="#A3F5A3" stroke-width="2"
        marker-end="url(#arrow-green)"/>
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect x="270" y="414" width="126" height="44" rx="8"
          fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <rect x="404" y="414" width="126" height="44" rx="8"
          fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="333" y="433" fill="#FFFFFF" text-anchor="middle" font-size="16">A</text>
    <text x="333" y="450" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
    <text x="467" y="433" fill="#FFFFFF" text-anchor="middle" font-size="16">B</text>
    <text x="467" y="450" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
  </g>

  <!-- Example 2: each branch consumes an existing three-cell stack. -->
  <rect x="44" y="490" width="712" height="478" rx="14"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="522" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">STACK TRANSFORM · CONSUMES THREE VALUES</text>

  <rect x="68" y="540" width="664" height="70" rx="10"
        fill="#000000" fill-opacity=".16" stroke="#4D4D4D"/>
  <foreignObject x="88" y="544" width="620" height="64">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:15px/21px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.mock</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">cond</span><span style="color:#C3C3B6"> -- </span><span style="color:#D2DFF9;font-style:italic">out</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#66FFE6">10 20 30</span>  cond <span style="color:#A3F5A3">.then + - else * - end</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <text x="400" y="638" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12" font-weight="700">ENTRY STACK</text>
  <g transform="translate(250 650)"
     font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect width="300" height="58" rx="9" fill="url(#state-fill)"
          stroke="#66FFE6" stroke-width="2"/>
    <path d="M100 0V58M200 0V58" stroke="#66FFE6"/>
    <text x="50" y="27" fill="#66FFE6" text-anchor="middle" font-size="19">10</text>
    <text x="50" y="47" fill="#C3C3B6" text-anchor="middle" font-size="10">x0</text>
    <text x="150" y="27" fill="#66FFE6" text-anchor="middle" font-size="19">20</text>
    <text x="150" y="47" fill="#C3C3B6" text-anchor="middle" font-size="10">x1</text>
    <text x="250" y="27" fill="#66FFE6" text-anchor="middle" font-size="19">30</text>
    <text x="250" y="47" fill="#C3C3B6" text-anchor="middle" font-size="10">x2</text>
  </g>

  <path d="M370 708L370 724L120 756" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M430 708L430 810L120 842" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <text x="68" y="772" fill="#C3C3B6" font-size="12" font-weight="700">TRUE</text>
    <text x="68" y="858" fill="#C3C3B6" font-size="12" font-weight="700">FALSE</text>

    <g transform="translate(120 738)">
      <rect width="198" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M66 0V58M132 0V58" stroke="#66FFE6"/>
      <text x="33" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="99" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="165" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
    </g>
    <circle cx="352" cy="767" r="25" fill="#181A1B" stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="352" y="777" fill="#A3F5A3" text-anchor="middle" font-size="32" font-weight="700">+</text>
    <path d="M377 767H397" stroke="#A3F5A3" stroke-width="2" marker-end="url(#arrow-green)"/>
    <g transform="translate(406 738)">
      <rect width="142" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M71 0V58" stroke="#66FFE6"/>
      <text x="35.5" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="106.5" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">50</text>
    </g>
    <circle cx="582" cy="767" r="25" fill="#181A1B" stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="582" y="776" fill="#A3F5A3" text-anchor="middle" font-size="31" font-weight="700">−</text>
    <path d="M607 767H627" stroke="#A3F5A3" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="636" y="738" width="96" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="684" y="764" fill="#66FFE6" text-anchor="middle" font-size="18">−40</text>
    <text x="684" y="785" fill="#C3C3B6" text-anchor="middle" font-size="10">x0 · out</text>

    <g transform="translate(120 824)">
      <rect width="198" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M66 0V58M132 0V58" stroke="#66FFE6"/>
      <text x="33" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="99" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="165" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
    </g>
    <circle cx="352" cy="853" r="25" fill="#181A1B" stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="352" y="864" fill="#A3F5A3" text-anchor="middle" font-size="32" font-weight="700">×</text>
    <path d="M377 853H397" stroke="#A3F5A3" stroke-width="2" marker-end="url(#arrow-green)"/>
    <g transform="translate(406 824)">
      <rect width="142" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M71 0V58" stroke="#66FFE6"/>
      <text x="35.5" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="106.5" y="35" fill="#66FFE6" text-anchor="middle" font-size="17">600</text>
    </g>
    <circle cx="582" cy="853" r="25" fill="#181A1B" stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="582" y="862" fill="#A3F5A3" text-anchor="middle" font-size="31" font-weight="700">−</text>
    <path d="M607 853H627" stroke="#A3F5A3" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="636" y="824" width="96" height="58" rx="9" fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="684" y="850" fill="#66FFE6" text-anchor="middle" font-size="18">−590</text>
    <text x="684" y="871" fill="#C3C3B6" text-anchor="middle" font-size="10">x0 · out</text>
  </g>

  <path d="M732 767H744V892L412 900" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M732 853H744V892L412 900" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="400" cy="900" r="5" fill="#A3F5A3"/>
  <path d="M400 905V913" stroke="#A3F5A3" stroke-width="2"
        marker-end="url(#arrow-green)"/>
  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <rect x="352" y="920" width="96" height="38" rx="8"
          fill="url(#state-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="400" y="937" fill="#FFFFFF" text-anchor="middle" font-size="14">out</text>
    <text x="400" y="952" fill="#C3C3B6" text-anchor="middle" font-size="9">x0</text>
  </g>
</svg>
