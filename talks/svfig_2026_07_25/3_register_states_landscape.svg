<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Stack effects directly map to register states</title>
  <desc>
    Five lines show register states after the source words 10, 20, 30,
    multiply, and add. Live registers are cyan. Values left above the current
    stack depth remain visible in gray.
  </desc>

  <defs>
    <linearGradient id="live-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="64" y="82" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">
    Stack effects directly map to register states
  </text>

  <rect x="64" y="108" width="1152" height="52" rx="8"
        fill="#FFFFFF" fill-opacity=".045" stroke="#333333"/>
  <text x="640" y="141" fill="#FFFFFF" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="21">
    <tspan fill="#A3F5A3">fun</tspan><tspan fill="#A8A8F0">:</tspan>
    <tspan fill="#D2DFF9" font-style="italic"> .some_word</tspan><tspan fill="#C3C3B6"> { -- </tspan><tspan fill="#D2DFF9" font-style="italic">out</tspan><tspan fill="#C3C3B6"> } </tspan>
    <tspan fill="#66FFE6">10 20 30</tspan>
    <tspan fill="#A3F5A3"> * +</tspan>
    <tspan fill="#A3F5A3"> end</tspan>
  </text>

  <!-- One source word and its resulting state per line. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- 10 -->
    <g transform="translate(0 184)">
      <rect x="64" y="0" width="84" height="64" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="106" y="40" fill="#66FFE6" text-anchor="middle"
            font-size="22" font-weight="700">10</text>
      <path d="M164 32H208" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="230" y="0" width="250" height="64" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <text x="252" y="40" fill="#C3C3B6" font-size="18">x0</text>
      <text x="452" y="40" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
    </g>

    <!-- 20 -->
    <g transform="translate(0 264)">
      <rect x="64" y="0" width="84" height="64" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="106" y="40" fill="#66FFE6" text-anchor="middle"
            font-size="22" font-weight="700">20</text>
      <path d="M164 32H208" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="230" y="0" width="510" height="64" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="480" y1="1" x2="480" y2="63" stroke="#66FFE6" stroke-opacity=".55"/>
      <text x="252" y="40" fill="#C3C3B6" font-size="18">x0</text>
      <text x="452" y="40" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="502" y="40" fill="#C3C3B6" font-size="18">x1</text>
      <text x="712" y="40" fill="#66FFE6" text-anchor="end" font-size="23">20</text>
    </g>

    <!-- 30 -->
    <g transform="translate(0 344)">
      <rect x="64" y="0" width="84" height="64" rx="9"
            fill="#66FFE6" fill-opacity=".10" stroke="#66FFE6"/>
      <text x="106" y="40" fill="#66FFE6" text-anchor="middle"
            font-size="22" font-weight="700">30</text>
      <path d="M164 32H208" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="230" y="0" width="770" height="64" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="480" y1="1" x2="480" y2="63" stroke="#66FFE6" stroke-opacity=".55"/>
      <line x1="740" y1="1" x2="740" y2="63" stroke="#66FFE6" stroke-opacity=".55"/>
      <text x="252" y="40" fill="#C3C3B6" font-size="18">x0</text>
      <text x="452" y="40" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="502" y="40" fill="#C3C3B6" font-size="18">x1</text>
      <text x="712" y="40" fill="#66FFE6" text-anchor="end" font-size="23">20</text>
      <text x="762" y="40" fill="#C3C3B6" font-size="18">x2</text>
      <text x="972" y="40" fill="#66FFE6" text-anchor="end" font-size="23">30</text>
    </g>

    <!-- multiply -->
    <g transform="translate(0 424)">
      <rect x="64" y="0" width="84" height="64" rx="9"
            fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3"/>
      <text x="106" y="41" fill="#A3F5A3" text-anchor="middle"
            font-size="26" font-weight="700">*</text>
      <path d="M164 32H208" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="230" y="0" width="510" height="64" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <line x1="480" y1="1" x2="480" y2="63" stroke="#66FFE6" stroke-opacity=".55"/>
      <rect x="750" y="0" width="250" height="64" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <text x="252" y="40" fill="#C3C3B6" font-size="18">x0</text>
      <text x="452" y="40" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
      <text x="502" y="40" fill="#C3C3B6" font-size="18">x1</text>
      <text x="712" y="40" fill="#66FFE6" text-anchor="end" font-size="23">600</text>
      <text x="772" y="40" fill="#666666" font-size="18">x2</text>
      <text x="972" y="40" fill="#777777" text-anchor="end" font-size="23">30</text>
    </g>

    <!-- add -->
    <g transform="translate(0 504)">
      <rect x="64" y="0" width="84" height="64" rx="9"
            fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3"/>
      <text x="106" y="41" fill="#A3F5A3" text-anchor="middle"
            font-size="26" font-weight="700">+</text>
      <path d="M164 32H208" fill="none" stroke="#C3C3B6"
            stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="230" y="0" width="250" height="64" rx="9"
            fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
      <rect x="490" y="0" width="250" height="64" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <rect x="750" y="0" width="250" height="64" rx="9"
            fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
      <text x="252" y="40" fill="#C3C3B6" font-size="18">x0</text>
      <text x="452" y="40" fill="#66FFE6" text-anchor="end" font-size="23">610</text>
      <text x="512" y="40" fill="#666666" font-size="18">x1</text>
      <text x="712" y="40" fill="#777777" text-anchor="end" font-size="23">600</text>
      <text x="772" y="40" fill="#666666" font-size="18">x2</text>
      <text x="972" y="40" fill="#777777" text-anchor="end" font-size="23">30</text>
    </g>
  </g>

  <circle cx="72" cy="624" r="6" fill="#66FFE6"/>
  <text x="92" y="631" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">live register stack</text>

  <circle cx="326" cy="624" r="6" fill="#777777"/>
  <text x="346" y="631" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">physical values above current depth</text>

  <text x="640" y="684" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19">
    word → resulting state
  </text>
</svg>
