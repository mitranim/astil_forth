<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Comptime arithmetic negotiates register slots with the compiler</title>
  <desc>
    Runtime arithmetic exposes a fixed two-input, one-output contract using
    fixed registers and does not negotiate with caller compiler state.
    Comptime addition asks the outer compiler for current register-stack state,
    receives argument length three and slots x1 and x2, then requests emission
    of add x1 x1 x2 and updates argument length to two. The same dialogue later
    supports inspecting constant values.
  </desc>

  <defs>
    <linearGradient id="live-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="runtime-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="comptime-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#66FFE6"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="67" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">
    Comptime arithmetic negotiates register slots with the compiler
  </text>

  <!-- Thin runtime contrast. -->
  <rect x="48" y="102" width="1184" height="126" rx="15"
        fill="url(#runtime-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="140" fill="#A8A8F0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18" font-weight="700">RUNTIME WORD</text>
  <text x="76" y="172" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21" font-weight="700">Fixed contract; no call-site negotiation</text>

  <g transform="translate(600 128)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="104" height="58" rx="8"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0"/>
    <text x="52" y="36" fill="#FFFFFF" text-anchor="middle" font-size="16">x0</text>
    <rect x="114" y="0" width="104" height="58" rx="8"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0"/>
    <text x="166" y="36" fill="#FFFFFF" text-anchor="middle" font-size="16">x1</text>
    <path d="M236 29H273" fill="none" stroke="#C3C3B6"
          stroke-width="2" marker-end="url(#arrow-muted)"/>
    <rect x="290" y="0" width="138" height="58" rx="8"
          fill="#FFFFFF" fill-opacity=".045" stroke="#A8A8F0"/>
    <text x="359" y="25" fill="#FFFFFF" text-anchor="middle" font-size="16">runtime <tspan fill="#A3F5A3">+</tspan></text>
    <text x="359" y="46" fill="#C3C3B6" text-anchor="middle" font-size="13">fixed x0, x1</text>
    <path d="M446 29H483" fill="none" stroke="#C3C3B6"
          stroke-width="2" marker-end="url(#arrow-muted)"/>
    <rect x="500" y="0" width="104" height="58" rx="8"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0"/>
    <text x="552" y="36" fill="#FFFFFF" text-anchor="middle" font-size="16">x0</text>
  </g>

  <!-- Comptime protocol. -->
  <rect x="48" y="256" width="1184" height="398" rx="16"
        fill="url(#comptime-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="294" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18" font-weight="700">COMPTIME +</text>
  <text x="76" y="325" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21" font-weight="700">Runs while its caller is being compiled</text>

  <!-- Initial register stack. -->
  <g transform="translate(680 280)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="174" height="56" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="174" y="0" width="174" height="56"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="348" y="0" width="174" height="56" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <text x="15" y="35" fill="#C3C3B6" font-size="14">x0</text>
    <text x="158" y="35" fill="#66FFE6" text-anchor="end" font-size="19">10</text>
    <text x="189" y="35" fill="#C3C3B6" font-size="14">x1</text>
    <text x="332" y="35" fill="#66FFE6" text-anchor="end" font-size="19">20</text>
    <text x="363" y="35" fill="#C3C3B6" font-size="14">x2</text>
    <text x="506" y="35" fill="#66FFE6" text-anchor="end" font-size="19">30</text>
  </g>

  <!-- Actors and negotiation. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="76" y="370" width="250" height="106" rx="11"
          fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3" stroke-width="2"/>
    <text x="201" y="409" fill="#A3F5A3" text-anchor="middle"
          font-size="17" font-weight="700">COMPTIME WORD</text>
    <text x="201" y="445" fill="#A3F5A3" text-anchor="middle" font-size="22">+</text>

    <rect x="954" y="370" width="250" height="106" rx="11"
          fill="#66FFE6" fill-opacity=".08" stroke="#66FFE6" stroke-width="2"/>
    <text x="1079" y="409" fill="#66FFE6" text-anchor="middle"
          font-size="17" font-weight="700">OUTER COMPILER</text>
    <text x="1079" y="440" fill="#C3C3B6" text-anchor="middle" font-size="14">stack state + code buffer</text>

    <text x="640" y="378" fill="#A3F5A3" text-anchor="middle"
          font-size="15">ASK: stack length + two usable slots</text>
    <path d="M326 391H954" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>

    <text x="640" y="423" fill="#66FFE6" text-anchor="middle"
          font-size="15">COMPILER: arg_len 3; x1, x2 ready</text>
    <path d="M954 436H326" fill="none" stroke="#66FFE6"
          stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <text x="640" y="468" fill="#A3F5A3" text-anchor="middle"
          font-size="15">TELL: emit instruction + set arg_len 2</text>
    <path d="M326 481H954" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="490" y="504" width="300" height="46" rx="8"
          fill="#FFFFFF" fill-opacity=".045"/>
    <text x="640" y="533" fill="#A3F5A3" text-anchor="middle"
          font-size="17">add x1, x1, x2</text>
  </g>

  <!-- Updated register stack. -->
  <g transform="translate(418 572)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="174" height="52" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="174" y="0" width="174" height="52"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="358" y="0" width="164" height="52" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
    <text x="15" y="33" fill="#C3C3B6" font-size="14">x0</text>
    <text x="158" y="33" fill="#66FFE6" text-anchor="end" font-size="18">10</text>
    <text x="189" y="33" fill="#C3C3B6" font-size="14">x1</text>
    <text x="332" y="33" fill="#66FFE6" text-anchor="end" font-size="18">50</text>
    <text x="373" y="33" fill="#666666" font-size="14">x2</text>
    <text x="506" y="33" fill="#777777" text-anchor="end" font-size="18">30</text>
  </g>

  <text x="640" y="695" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18">
    Later: ask about values, not only slots
  </text>
</svg>
