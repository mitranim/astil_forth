<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Semantic roles require distinct syntactic roles</title>
  <desc>
    A real Astil Forth HTTP server excerpt rendered with the Role Dark editor
    scheme. Value-like names are plain white, call-like names are green,
    declared names are pale blue italic, punctuation and modifiers are purple
    or muted, constants are cyan, and words parsed as data use the raw-string
    background. A four-part key explains noun, verb, declaration, and parser
    roles. All changes are pure renaming and require no compiler changes.
  </desc>

  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="key-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".012"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="62" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="36" font-weight="700">
    Semantic roles require distinct syntactic roles
  </text>

  <!-- Exact editor rendering. -->
  <rect x="48" y="96" width="760" height="526" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="72" y="128" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">EXCERPT · examples/http_echo.af</text>

  <!--
    Exact Role Dark rendering for a standalone .af buffer:
      bg             hsl(200, 5%, 10%)
      fg             white
      action_fg      hsl(120, 80%, 80%)
      modifier_fg    hsl(240, 70%, 80%)
      declaration_fg hsl(220, 75%, 90%), italic
      const_fg       hsl(170, 100%, 70%)
      raw_fg         hsl(60, 50%, 95%)
      raw_bg         white at 6% alpha
      comment_fg     hsl(60, 10%, 74%)
  -->

  <rect x="64" y="145" width="728" height="276" rx="10"
        fill="#181A1B" stroke="#333333"/>
  <!-- Native HTML layout: pre owns whitespace; spans own highlighting. -->
  <foreignObject x="72" y="153" width="712" height="252">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:18px/28px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">fun</span><span style="color:#A8A8F0">:</span> <span style="color:#D2DFF9;font-style:italic">.run</span> <span style="color:#C3C3B6">{ -- </span><span style="color:#A8A8F0;font-style:italic">err</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#A8A8F0">"</span><span style="color:#F9F9E5;background:rgba(255,255,255,.06)"> 2345</span><span style="color:#A8A8F0">"</span>                  <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">port</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#66FFE6">128</span>                      <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">backlog</span><span style="color:#C3C3B6"> }</span>
  <span style="color:#A3F5A3">instr</span><span style="color:#A8A8F0">'</span> <span style="color:#F9F9E5;background:rgba(255,255,255,.06)">.handle_conn</span>      <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">handler</span><span style="color:#C3C3B6"> }</span>
  port backlog <span style="color:#A3F5A3">.net_listen</span> <span style="color:#C3C3B6">{ </span><span style="color:#D2DFF9;font-style:italic">sock</span><span style="color:#C3C3B6"> }</span>

  <span style="color:#A8A8F0">"</span><span style="color:#F9F9E5;background:rgba(255,255,255,.06)"> [srv] listening on http://localhost:%s\n</span><span style="color:#A8A8F0">"</span> port <span style="color:#A3F5A3">.elogf</span>
  sock handler <span style="color:#A3F5A3">.net_accept_loop_threaded</span>
<span style="color:#A3F5A3">end</span></pre>
    </div>
  </foreignObject>

  <line x1="72" y1="448" x2="784" y2="448" stroke="#4D4D4D" stroke-width="2"/>
  <text x="72" y="493"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="22" font-weight="700">
    <tspan fill="#FFFFFF">SEMANTIC ROLE</tspan>
    <tspan fill="#C3C3B6"> → </tspan>
    <tspan fill="#D2DFF9">SPELLING</tspan>
    <tspan fill="#C3C3B6"> → </tspan>
    <tspan fill="#A3F5A3">HIGHLIGHTING</tspan>
  </text>
  <text x="72" y="535" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19" font-weight="700">Every semantic role has distinct source syntax</text>
  <text x="72" y="566" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Spelling exposes the role; spelling does not define its semantics</text>

  <!-- Four semantic/syntactic pairings. -->
  <rect x="824" y="96" width="408" height="526" rx="16"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="848" y="128" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">FOUR ROLES IN THIS EXCERPT</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <!-- Noun. -->
    <rect x="848" y="148" width="360" height="100" rx="11"
          fill="url(#key-fill)" stroke="#4D4D4D"/>
    <text x="870" y="177" fill="#C3C3B6" font-size="13" font-weight="700">NOUN · VALUE</text>
    <text x="870" y="218" fill="#FFFFFF" font-size="21">port</text>
    <text x="1186" y="218" fill="#C3C3B6" text-anchor="end"
          font-size="13">value-like identifier</text>

    <!-- Verb. -->
    <rect x="848" y="260" width="360" height="100" rx="11"
          fill="url(#key-fill)" stroke="#4D4D4D"/>
    <text x="870" y="289" fill="#C3C3B6" font-size="13" font-weight="700">VERB · CALL</text>
    <text x="870" y="330" fill="#A3F5A3" font-size="20">.net_listen</text>
    <text x="1186" y="330" fill="#C3C3B6" text-anchor="end"
          font-size="13">call-like spelling</text>

    <!-- Declaration. -->
    <rect x="848" y="372" width="360" height="100" rx="11"
          fill="url(#key-fill)" stroke="#4D4D4D"/>
    <text x="870" y="401" fill="#C3C3B6" font-size="13" font-weight="700">DECLARATION · SUFFIX :</text>
    <text x="870" y="437" font-size="20">
      <tspan fill="#A3F5A3">fun</tspan><tspan fill="#A8A8F0">:</tspan>
      <tspan fill="#D2DFF9" font-style="italic"> .run</tspan>
    </text>
    <text x="870" y="458" fill="#C3C3B6" font-size="13">next word is declared</text>

    <!-- Parser. -->
    <rect x="848" y="484" width="360" height="110" rx="11"
          fill="url(#key-fill)" stroke="#4D4D4D"/>
    <text x="870" y="513" fill="#C3C3B6" font-size="13" font-weight="700">PARSER · SUFFIX '</text>
  </g>
  <foreignObject x="870" y="525" width="316" height="36">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <pre style="margin:0;color:#FFFFFF;font:18px/30px SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace"><span style="color:#A3F5A3">instr</span><span style="color:#A8A8F0">'</span> <span style="color:#F9F9E5;background:rgba(255,255,255,.06)">.handle_conn</span></pre>
    </div>
  </foreignObject>
  <text x="870" y="580" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="13">next word is parsed as data</text>

  <line x1="48" y1="652" x2="1232" y2="652" stroke="#333333" stroke-width="2"/>
  <text x="640" y="687" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">
    <tspan fill="#A3F5A3" font-weight="700">PURE RENAMING</tspan>
    <tspan fill="#C3C3B6"> — no compiler changes; any Forth can adopt this</tspan>
  </text>
</svg>
