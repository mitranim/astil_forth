<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Runtime calls replace the whole stack; comptime words target selected registers</title>
  <desc>
    Both paths begin with values 10, 20, and 30 in x0, x1, and x2. A runtime
    add word has fixed arity two and cannot accept the three-value stack.
    A comptime add word reads stack length three, selects top registers x1 and
    x2, emits an add targeting those registers, and reduces live length to two.
  </desc>

  <defs>
    <linearGradient id="live-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="runtime-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="comptime-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C3C3B6"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="61" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">
    <tspan x="44" dy="0">Runtime calls replace the whole stack;</tspan>
    <tspan x="44" dy="42">comptime words target selected registers</tspan>
  </text>

  <!-- Shared starting state. -->
  <text x="44" y="157" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700">AFTER <tspan fill="#66FFE6">10 20 30</tspan></text>
  <g transform="translate(80 177)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="200" height="70" rx="9"
          fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
    <rect x="200" y="0" width="200" height="70"
          fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
    <rect x="400" y="0" width="200" height="70" rx="9"
          fill="url(#live-fill)" stroke="#66FFE6" stroke-width="2"/>
    <text x="20" y="43" fill="#C3C3B6" font-size="17">x0</text>
    <text x="176" y="43" fill="#66FFE6" text-anchor="end" font-size="23">10</text>
    <text x="220" y="43" fill="#C3C3B6" font-size="17">x1</text>
    <text x="376" y="43" fill="#66FFE6" text-anchor="end" font-size="23">20</text>
    <text x="420" y="43" fill="#C3C3B6" font-size="17">x2</text>
    <text x="576" y="43" fill="#66FFE6" text-anchor="end" font-size="23">30</text>
  </g>

  <!-- Runtime path. -->
  <rect x="44" y="286" width="712" height="252" rx="16"
        fill="url(#runtime-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="72" y="328" fill="#A8A8F0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">RUNTIME CALL</text>
  <text x="72" y="360" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">Compiles with hardcoded registers</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="72" y="386" width="270" height="64" rx="9"
          fill="#FFFFFF" fill-opacity=".045" stroke="#A8A8F0"/>
    <text x="207" y="413" fill="#FFFFFF" text-anchor="middle" font-size="17"><tspan fill="#A3F5A3">.add</tspan><tspan fill="#C3C3B6"> { i0 i1 → out }</tspan></text>
    <text x="207" y="438" fill="#C3C3B6" text-anchor="middle" font-size="14">fixed x0, x1</text>

    <path d="M360 418H407" fill="none" stroke="#C3C3B6"
          stroke-width="2" marker-end="url(#arrow-muted)"/>

    <rect x="426" y="386" width="136" height="64" rx="9"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0"/>
    <text x="494" y="413" fill="#FFFFFF" text-anchor="middle" font-size="16">requires 2</text>
    <text x="494" y="438" fill="#C3C3B6" text-anchor="middle" font-size="14">provided 3</text>

    <line x1="590" y1="398" x2="626" y2="438" stroke="#FF6666"
          stroke-width="4" stroke-linecap="round"/>
    <line x1="626" y1="398" x2="590" y2="438" stroke="#FF6666"
          stroke-width="4" stroke-linecap="round"/>
    <text x="650" y="425" fill="#FF6666" font-size="16">mismatch</text>
  </g>

  <circle cx="78" cy="490" r="5" fill="#A8A8F0"/>
  <text x="96" y="497" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">call consumes all inputs; outputs replace entire stack</text>
  <text x="682" y="497" fill="#C3C3B6" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="15"><tspan fill="#66FFE6">10 20 30</tspan><tspan> </tspan><tspan fill="#A3F5A3">.add</tspan><tspan fill="#FF6666"> ✕</tspan></text>

  <!-- Comptime path. -->
  <rect x="44" y="570" width="712" height="347" rx="16"
        fill="url(#comptime-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="72" y="612" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">COMPTIME WORD</text>
  <text x="72" y="644" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">Selects registers from current length</text>

  <!-- Selected input state. -->
  <g transform="translate(72 674)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="150" height="62" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="150" y="0" width="150" height="62"
          fill="url(#live-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <rect x="300" y="0" width="150" height="62" rx="8"
          fill="url(#live-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <text x="18" y="38" fill="#C3C3B6" font-size="15">x0</text>
    <text x="132" y="38" fill="#66FFE6" text-anchor="end" font-size="20">10</text>
    <text x="168" y="38" fill="#A3F5A3" font-size="15">x1</text>
    <text x="282" y="38" fill="#66FFE6" text-anchor="end" font-size="20">20</text>
    <text x="318" y="38" fill="#A3F5A3" font-size="15">x2</text>
    <text x="432" y="38" fill="#66FFE6" text-anchor="end" font-size="20">30</text>

    <path d="M468 31H505" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="520" y="0" width="120" height="62" rx="8"
          fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3"/>
    <text x="580" y="26" fill="#FFFFFF" text-anchor="middle" font-size="15">length 3</text>
    <text x="580" y="47" fill="#A3F5A3" text-anchor="middle" font-size="13">select x1, x2</text>
  </g>

  <!-- Emitted instruction. -->
  <path d="M400 748V771" fill="none" stroke="#A3F5A3"
        stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="242" y="782" width="316" height="54" rx="8"
        fill="#FFFFFF" fill-opacity=".05"/>
  <text x="400" y="816" fill="#FFFFFF" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18">
    <tspan fill="#A3F5A3">add x1, x1, x2</tspan>
  </text>

  <!-- Resulting logical state. -->
  <g transform="translate(72 850)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="210" height="48" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="210" y="0" width="210" height="48" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="430" y="0" width="210" height="48" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
    <text x="16" y="31" fill="#C3C3B6" font-size="14">x0</text>
    <text x="192" y="31" fill="#66FFE6" text-anchor="end" font-size="18">10</text>
    <text x="226" y="31" fill="#C3C3B6" font-size="14">x1</text>
    <text x="402" y="31" fill="#66FFE6" text-anchor="end" font-size="18">50</text>
    <text x="446" y="31" fill="#666666" font-size="14">x2</text>
    <text x="622" y="31" fill="#777777" text-anchor="end" font-size="18">30</text>
  </g>

  <text x="400" y="968" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="18">
    runtime: whole-stack boundary · comptime: local stack edit
  </text>
</svg>
