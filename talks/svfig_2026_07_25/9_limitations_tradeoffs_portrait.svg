<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Runtime calls reset register state; local stack code stays direct</title>
  <desc>
    Portrait summary of the register-stack limitation and its tradeoffs.
    Arithmetic and memory operations edit selected register slots directly.
    Runtime and foreign calls replace the entire register stack. Removing that
    boundary would require either a more complex compiler or hidden memory
    operations, so Astil keeps the boundary and gains simple code generation,
    compile-time arity checking, strong performance, and portable stack code.
  </desc>

  <defs>
    <linearGradient id="direct-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="call-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".015"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8A8F0"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <text x="44" y="58" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="23" font-weight="700">
    Runtime calls reset register state; local stack code stays direct
  </text>

  <!-- Scope of the restriction. -->
  <rect x="44" y="86" width="712" height="358" rx="15"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="120" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">WHERE THE RESTRICTION APPLIES</text>

  <!-- Direct local edits. -->
  <rect x="68" y="140" width="316" height="278" rx="13"
        fill="url(#direct-fill)" stroke="#66FFE6" stroke-width="2"/>
  <text x="90" y="174" fill="#66FFE6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">COMPTIME · LOCAL EDIT</text>
  <text x="90" y="202" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Arithmetic · load · store</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(90 226)">
      <rect width="204" height="58" rx="8" fill="url(#direct-fill)" stroke="#66FFE6"/>
      <path d="M68 0V58M136 0V58" stroke="#66FFE6"/>
      <text x="34" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="102" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="170" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x2</text>
      <text x="34" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">keep</text>
      <text x="102" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">a</text>
      <text x="170" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">b</text>
    </g>
    <circle cx="326" cy="255" r="23" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2.5"/>
    <text x="326" y="264" fill="#A3F5A3" text-anchor="middle"
          font-size="29" font-weight="700">+</text>
    <path d="M326 278V339H304" fill="none" stroke="#A3F5A3" stroke-width="2"
          marker-end="url(#arrow-green)"/>

    <g transform="translate(90 310)">
      <rect width="204" height="58" rx="8" fill="url(#direct-fill)" stroke="#66FFE6"/>
      <path d="M102 0V58" stroke="#66FFE6"/>
      <text x="51" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="153" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="51" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">keep</text>
      <text x="153" y="47" fill="#66FFE6" text-anchor="middle" font-size="14">a+b</text>
    </g>
  </g>
  <text x="226" y="398" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12">selected slots · no hidden memory</text>

  <!-- Whole-stack call boundary. -->
  <rect x="416" y="140" width="316" height="278" rx="13"
        fill="url(#call-fill)" stroke="#A8A8F0" stroke-width="2"/>
  <text x="438" y="174" fill="#A8A8F0"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">RUNTIME / FOREIGN CALL</text>
  <text x="438" y="202" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="700">Whole-stack boundary</text>

  <g font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace">
    <g transform="translate(438 226)">
      <rect width="166" height="54" rx="8" fill="url(#direct-fill)" stroke="#66FFE6"/>
      <path d="M55.33 0V54M110.67 0V54" stroke="#66FFE6"/>
      <text x="27.67" y="33" fill="#FFFFFF" text-anchor="middle" font-size="13">x0</text>
      <text x="83" y="33" fill="#FFFFFF" text-anchor="middle" font-size="13">x1</text>
      <text x="138.33" y="33" fill="#FFFFFF" text-anchor="middle" font-size="13">x2</text>
    </g>
    <path d="M604 253H620" stroke="#A8A8F0" stroke-width="2"
          marker-end="url(#arrow-purple)"/>
    <rect x="630" y="226" width="80" height="54" rx="8"
          fill="#A8A8F0" fill-opacity=".10" stroke="#A8A8F0" stroke-width="2"/>
    <text x="670" y="258" fill="#A3F5A3" text-anchor="middle"
          font-size="15">.call</text>

    <path d="M670 280V304" stroke="#A8A8F0" stroke-width="2"
          marker-end="url(#arrow-purple)"/>
    <g transform="translate(516 312)">
      <rect width="138" height="56" rx="8" fill="url(#call-fill)" stroke="#A8A8F0"/>
      <path d="M69 0V56" stroke="#A8A8F0"/>
      <text x="34.5" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="103.5" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="34.5" y="45" fill="#FFFFFF" text-anchor="middle" font-size="13">out0</text>
      <text x="103.5" y="45" fill="#FFFFFF" text-anchor="middle" font-size="13">out1</text>
    </g>
  </g>
  <text x="574" y="398" fill="#C3C3B6" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="12">outputs replace every prior stack cell</text>

  <!-- Deliberate tradeoff. -->
  <rect x="44" y="468" width="712" height="214" rx="15"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="502" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">REMOVING THAT BOUNDARY REQUIRES</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="68" y="524" width="290" height="82" rx="11"
          fill="#FF3333" fill-opacity=".035" stroke="#FF6666"/>
    <text x="213" y="558" fill="#FFFFFF" text-anchor="middle"
          font-size="19" font-weight="700">More complex compiler</text>
    <text x="213" y="585" fill="#C3C3B6" text-anchor="middle"
          font-size="15">track values across opaque calls</text>

    <text x="400" y="575" fill="#C3C3B6" text-anchor="middle"
          font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
          font-size="16">OR</text>

    <rect x="442" y="524" width="290" height="82" rx="11"
          fill="#FF3333" fill-opacity=".035" stroke="#FF6666"/>
    <text x="587" y="558" fill="#FFFFFF" text-anchor="middle"
          font-size="19" font-weight="700">Hidden memory traffic</text>
    <text x="587" y="585" fill="#C3C3B6" text-anchor="middle"
          font-size="15">spill and reconstruct stack state</text>
  </g>

  <path d="M68 628H732" stroke="#4D4D4D"/>
  <text x="400" y="657" fill="#A3F5A3" text-anchor="middle"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="16" font-weight="700">CHOICE · KEEP THE EXPLICIT CALL BOUNDARY</text>

  <!-- Lessons. -->
  <rect x="44" y="706" width="712" height="226" rx="15"
        fill="url(#panel-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="68" y="740" fill="#C3C3B6"
        font-family="SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="14" font-weight="700">WHAT THE RESTRICTION BUYS</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
     font-size="17">
    <circle cx="76" cy="774" r="5" fill="#A3F5A3"/>
    <text x="94" y="781" fill="#FFFFFF">arity known at comptime → mistakes are checked</text>

    <circle cx="76" cy="814" r="5" fill="#66FFE6"/>
    <text x="94" y="821" fill="#FFFFFF">direct numbered registers → simple code generation</text>

    <circle cx="76" cy="854" r="5" fill="#A8A8F0"/>
    <text x="94" y="861" fill="#FFFFFF">small, imperfect compiler → near-Clang benchmark speed</text>

    <circle cx="76" cy="894" r="5" fill="#C3C3B6"/>
    <text x="94" y="901" fill="#FFFFFF">restricted source remains valid for full stack machines</text>
  </g>

  <text x="400" y="973" fill="#FFFFFF" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="22" font-weight="700">
    Don’t force an abstract stack machine; map language state to CPU state
  </text>
</svg>
