<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Constant folding rewinds instructions as abstract values collapse</title>
  <desc>
    Four constant literals create parallel abstract-value and emitted-
    instruction stacks. Addition, subtraction, and multiplication reduce both
    stacks from left to right until one constant remains. A side note shows
    partial folding of a runtime value plus ten into one add-immediate
    instruction.
  </desc>

  <defs>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="fold-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".035"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="62" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="36" font-weight="700">
    Constant folding rewinds instructions as abstract values collapse
  </text>

  <!-- Source sequence. -->
  <rect x="48" y="88" width="1184" height="64" rx="12"
        fill="#FFFFFF" fill-opacity=".035" stroke="#4D4D4D" stroke-width="2"/>
  <text x="74" y="128" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">SOURCE</text>
  <text x="1206" y="129" fill="#FFFFFF" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="24"><tspan fill="#66FFE6">10 20 30 40</tspan><tspan fill="#A3F5A3"> + - *</tspan></text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- Abstract stack lane. -->
    <text x="54" y="195" fill="#66FFE6" font-size="16" font-weight="700">
      ABSTRACT STACK
    </text>

    <!-- Four values. -->
    <g transform="translate(54 214)">
      <rect width="224" height="58" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M56 0V58M112 0V58M168 0V58" stroke="#66FFE6"/>
      <text x="28" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="84" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="140" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
      <text x="196" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">40</text>
    </g>

    <!-- Three values. -->
    <g transform="translate(370 214)">
      <rect width="224" height="58" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M74.67 0V58M149.33 0V58" stroke="#66FFE6"/>
      <text x="37.33" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="112" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="186.67" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">70</text>
    </g>

    <!-- Two values. -->
    <g transform="translate(686 214)">
      <rect width="224" height="58" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M112 0V58" stroke="#66FFE6"/>
      <text x="56" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="168" y="36" fill="#66FFE6" text-anchor="middle" font-size="17">-50</text>
    </g>

    <!-- One value. -->
    <g transform="translate(1002 214)">
      <rect width="224" height="58" rx="9"
            fill="url(#fold-fill)" stroke="#A3F5A3" stroke-width="2"/>
      <text x="112" y="37" fill="#66FFE6" text-anchor="middle"
            font-size="19" font-weight="700">-500</text>
    </g>

    <!-- Operators anchored on state arrows. -->
    <path d="M282 243H358" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="324" cy="243" r="14" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2"/>
    <text x="324" y="250" fill="#A3F5A3" text-anchor="middle"
          font-size="22" font-weight="700">+</text>

    <path d="M598 243H674" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="640" cy="243" r="14" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2"/>
    <text x="640" y="250" fill="#A3F5A3" text-anchor="middle"
          font-size="22" font-weight="700">-</text>

    <path d="M914 243H990" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <circle cx="956" cy="243" r="14" fill="#181A1B"
            stroke="#A3F5A3" stroke-width="2"/>
    <text x="956" y="250" fill="#A3F5A3" text-anchor="middle"
          font-size="22" font-weight="700">*</text>

    <!-- Emitted instruction stack lane. -->
    <text x="54" y="326" fill="#66FFE6" font-size="16" font-weight="700">
      EMITTED INSTR STACK
    </text>
    <text x="1226" y="326" fill="#C3C3B6" text-anchor="end" font-size="13">
      one tile = one mov
    </text>

    <!-- Four instructions. -->
    <g transform="translate(54 345)">
      <rect width="224" height="68" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M56 0V68M112 0V68M168 0V68" stroke="#66FFE6"/>
      <text x="28" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="28" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="84" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="84" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="140" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x2</text>
      <text x="140" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">30</text>
      <text x="196" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x3</text>
      <text x="196" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">40</text>
    </g>

    <!-- Three instructions. -->
    <g transform="translate(370 345)">
      <rect width="224" height="68" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M74.67 0V68M149.33 0V68" stroke="#66FFE6"/>
      <text x="37.33" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="37.33" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="112" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="112" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">20</text>
      <text x="186.67" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x2</text>
      <text x="186.67" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">70</text>
    </g>

    <!-- Two instructions. -->
    <g transform="translate(686 345)">
      <rect width="224" height="68" rx="9"
            fill="url(#state-fill)" stroke="#66FFE6"/>
      <path d="M112 0V68" stroke="#66FFE6"/>
      <text x="56" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="56" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>
      <text x="168" y="24" fill="#C3C3B6" text-anchor="middle" font-size="11">x1</text>
      <text x="168" y="50" fill="#66FFE6" text-anchor="middle" font-size="17">-50</text>
    </g>

    <!-- One instruction. -->
    <g transform="translate(1002 345)">
      <rect width="224" height="68" rx="9"
            fill="url(#fold-fill)" stroke="#A3F5A3" stroke-width="2"/>
      <text x="112" y="25" fill="#C3C3B6" text-anchor="middle" font-size="11">x0</text>
      <text x="112" y="52" fill="#66FFE6" text-anchor="middle"
            font-size="19" font-weight="700">-500</text>
    </g>

    <!-- Instruction rewinds between states. -->
    <text x="324" y="352" fill="#C3C3B6" text-anchor="middle" font-size="12">rewind 2</text>
    <path d="M286 379H358" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="640" y="352" fill="#C3C3B6" text-anchor="middle" font-size="12">rewind 2</text>
    <path d="M602 379H674" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="956" y="352" fill="#C3C3B6" text-anchor="middle" font-size="12">rewind 2</text>
    <path d="M918 379H990" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Full-fold result. -->
  <rect x="48" y="466" width="610" height="190" rx="15"
        fill="#A3F5A3" fill-opacity=".06" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="507" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">FINAL CODE</text>
  <text x="630" y="510" fill="#A3F5A3" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="24">mov x0, <tspan fill="#66FFE6">#-500</tspan></text>
  <path d="M76 535H630" stroke="#4D4D4D" stroke-width="1"/>
  <text x="76" y="574" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Inspect values → consume two</text>
  <text x="76" y="609" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18">Rewind code → emit one constant</text>

  <!-- Partial-fold side note. -->
  <rect x="682" y="466" width="550" height="190" rx="15"
        fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D" stroke-width="2"/>
  <text x="710" y="507" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="15" font-weight="700">PARTIAL FOLD</text>
  <text x="1204" y="507" fill="#C3C3B6" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">runtime value + literal</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="710" y="536" width="104" height="62" rx="9"
          fill="url(#state-fill)" stroke="#66FFE6"/>
    <text x="762" y="558" fill="#C3C3B6" text-anchor="middle" font-size="12">x0</text>
    <text x="762" y="583" fill="#FFFFFF" text-anchor="middle" font-size="17">any</text>

    <text x="837" y="575" fill="#A3F5A3" text-anchor="middle"
          font-size="22" font-weight="700">+</text>

    <rect x="858" y="536" width="86" height="62" rx="9"
          fill="url(#fold-fill)" stroke="#A3F5A3"/>
    <text x="901" y="558" fill="#C3C3B6" text-anchor="middle" font-size="12">x1</text>
    <text x="901" y="583" fill="#66FFE6" text-anchor="middle" font-size="17">10</text>

    <text x="986" y="541" fill="#C3C3B6" text-anchor="middle" font-size="11">
      rewind mov
    </text>
    <path d="M960 570H1012" fill="none" stroke="#A3F5A3"
          stroke-width="2" marker-end="url(#arrow-green)"/>

    <text x="1030" y="577" fill="#A3F5A3" font-size="18">add x0, x0, <tspan fill="#66FFE6">#10</tspan></text>
  </g>

  <text x="957" y="630" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16">Keep runtime input; fold literal into instruction</text>
</svg>
