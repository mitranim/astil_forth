<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Hardware-rotated vs fixed-address register stacks</title>
  <desc>
    GreenArrays has explicit T and S registers above eight circularly addressed
    stack registers; instructions implicitly operate on stack positions. Astil
    Forth uses eighteen fixed-address Arm64 registers from x0 through x17;
    instructions explicitly address registers. GreenArrays rotates hardware
    beneath the stack while Astil tracks the stack in its compiler.
  </desc>

  <defs>
    <linearGradient id="ga-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="astil-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".015"/>
    </linearGradient>
    <marker id="ga-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="astil-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#66FFE6"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Opaque dark background for GitHub light mode. -->
  <rect width="1280" height="720" fill="#181A1B"/>

  <!-- Title -->
  <text x="72" y="108" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="700">Hardware-rotated vs fixed-address register stacks</text>

  <!-- Panels -->
  <rect x="72" y="166" width="544" height="454" rx="18"
        fill="url(#ga-glow)" stroke="#333333" stroke-width="2"/>
  <rect x="664" y="166" width="544" height="454" rx="18"
        fill="url(#astil-glow)" stroke="#333333" stroke-width="2"/>

  <!-- GreenArrays -->
  <text x="112" y="214" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22" font-weight="700">GREENARRAYS F18A</text>
  <text x="112" y="254" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="27" font-weight="700">Hardware rotates under the stack</text>

  <!-- T and S -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     text-anchor="middle">
    <rect x="112" y="290" width="112" height="68" rx="9"
          fill="#A3F5A3" fill-opacity=".18" stroke="#A3F5A3" stroke-width="2"/>
    <rect x="236" y="290" width="112" height="68" rx="9"
          fill="#A3F5A3" fill-opacity=".10" stroke="#A3F5A3" stroke-width="2"/>
    <text x="168" y="320" fill="#FFFFFF" font-size="24" font-weight="700">T</text>
    <text x="168" y="344" fill="#C3C3B6" font-size="14">top</text>
    <text x="292" y="320" fill="#FFFFFF" font-size="24" font-weight="700">S</text>
    <text x="292" y="344" fill="#C3C3B6" font-size="14">second</text>
  </g>
  <text x="374" y="316" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19">+</text>
  <text x="400" y="316" fill="#C3C3B6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17">uses S,T</text>
  <text x="374" y="345" fill="#C3C3B6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">no register fields</text>

  <!-- Circular hardware stack -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="15" text-anchor="middle">
    <rect x="112" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".10"
          stroke="#A3F5A3" stroke-opacity=".7"/>
    <rect x="168" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".08"
          stroke="#A3F5A3" stroke-opacity=".65"/>
    <rect x="224" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".07"
          stroke="#A3F5A3" stroke-opacity=".6"/>
    <rect x="280" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".06"
          stroke="#A3F5A3" stroke-opacity=".55"/>
    <rect x="336" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".06"
          stroke="#A3F5A3" stroke-opacity=".55"/>
    <rect x="392" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".5"/>
    <rect x="448" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".5"/>
    <rect x="504" y="404" width="50" height="48" rx="6" fill="#A3F5A3" fill-opacity=".05"
          stroke="#A3F5A3" stroke-opacity=".5"/>
    <text x="137" y="434" fill="#FFFFFF">0</text>
    <text x="193" y="434" fill="#FFFFFF">1</text>
    <text x="249" y="434" fill="#FFFFFF">2</text>
    <text x="305" y="434" fill="#FFFFFF">3</text>
    <text x="361" y="434" fill="#FFFFFF">4</text>
    <text x="417" y="434" fill="#FFFFFF">5</text>
    <text x="473" y="434" fill="#FFFFFF">6</text>
    <text x="529" y="434" fill="#FFFFFF">7</text>
  </g>
  <path d="M128 478 C128 512 538 512 538 478" fill="none"
        stroke="#A3F5A3" stroke-width="2" marker-end="url(#ga-arrow)"/>
  <text x="333" y="526" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">8 circularly addressed registers</text>

  <line x1="112" y1="555" x2="576" y2="555" stroke="#333333" stroke-width="2"/>
  <text x="112" y="590" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="19">Runtime words: arbitrary stack effects</text>

  <!-- Astil Forth -->
  <text x="704" y="214" fill="#66FFE6"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22" font-weight="700">ASTIL FORTH / ARM64</text>
  <text x="704" y="254" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="27" font-weight="700">Compiler tracks fixed registers</text>

  <!-- Fixed-address register strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="17" text-anchor="middle">
    <rect x="704" y="290" width="76" height="68" rx="9"
          fill="#66FFE6" fill-opacity=".18" stroke="#66FFE6" stroke-width="2"/>
    <rect x="788" y="290" width="76" height="68" rx="9"
          fill="#66FFE6" fill-opacity=".14" stroke="#66FFE6" stroke-width="2"/>
    <rect x="872" y="290" width="76" height="68" rx="9"
          fill="#66FFE6" fill-opacity=".11" stroke="#66FFE6" stroke-width="2"/>
    <rect x="956" y="290" width="76" height="68" rx="9"
          fill="#66FFE6" fill-opacity=".08" stroke="#66FFE6" stroke-opacity=".7" stroke-width="2"/>
    <rect x="1040" y="290" width="128" height="68" rx="9"
          fill="#66FFE6" fill-opacity=".05" stroke="#66FFE6" stroke-opacity=".55" stroke-width="2"/>
    <text x="742" y="331" fill="#FFFFFF">x0</text>
    <text x="826" y="331" fill="#FFFFFF">x1</text>
    <text x="910" y="331" fill="#FFFFFF">x2</text>
    <text x="994" y="331" fill="#C3C3B6">x3</text>
    <text x="1104" y="331" fill="#C3C3B6">… x17</text>
  </g>

  <!-- Addressed instruction -->
  <path d="M910 370 L910 397" fill="none" stroke="#66FFE6"
        stroke-width="2" marker-end="url(#astil-arrow)"/>
  <rect x="704" y="404" width="464" height="72" rx="9" fill="#FFFFFF" fill-opacity=".06"/>
  <text x="936" y="449" fill="#FFFFFF" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="23">
    <tspan fill="#A3F5A3">add</tspan>
    <tspan> x2, x2, x3</tspan>
  </text>
  <text x="936" y="511" fill="#C3C3B6" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">register numbers encoded in every instruction</text>

  <line x1="704" y1="545" x2="1168" y2="545" stroke="#333333" stroke-width="2"/>
  <circle cx="712" cy="573" r="5" fill="#66FFE6"/>
  <text x="730" y="580" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">Runtime words: consume + replace full stack</text>
  <circle cx="712" cy="603" r="5" fill="#A3F5A3"/>
  <text x="730" y="610" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17">Comptime words: operate on top values</text>

  <!-- Takeaway -->
  <text x="640" y="676" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="20">
    GreenArrays hides register numbers in hardware · Astil exposes them to software
  </text>
</svg>
