<svg width="100%" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Apple Arm64 ABI and Astil register allocation</title>
  <desc>
    Portrait mapping from Apple Arm64 register groups to Astil Forth roles.
    Registers x0 through x17 become stack and local positions, x18 remains unused,
    and x19 through x27 hold spilled locals. Register x28 points to the current
    context, whose standard header always provides a bump allocator. The JIT main
    thread uses the interpreter object; programs may define context objects.
  </desc>

  <defs>
    <linearGradient id="stack-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".20"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="local-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".06"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#181A1B"/>

  <!-- Title -->
  <text x="56" y="76" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">Apple Arm64 ABI and Astil</text>
  <text x="56" y="114" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="34" font-weight="700">register allocation</text>

  <!-- Column headers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="15" font-weight="700">
    <text x="56" y="167" fill="#C3C3B6">REGISTERS</text>
    <text x="184" y="167" fill="#C3C3B6">APPLE ARM64 ABI</text>
    <text x="448" y="167" fill="#66FFE6">ASTIL FORTH</text>
  </g>

  <!-- Row backgrounds -->
  <g stroke="#333333" stroke-width="2">
    <rect x="56" y="188" width="688" height="88" rx="10" fill="#FFFFFF" fill-opacity=".035"/>
    <rect x="56" y="276" width="688" height="88" fill="#FFFFFF" fill-opacity=".020"/>
    <rect x="56" y="364" width="688" height="88" fill="#FFFFFF" fill-opacity=".035"/>
    <rect x="56" y="452" width="688" height="76" fill="#FF3333" fill-opacity=".035"/>
    <rect x="56" y="528" width="688" height="88" fill="#FFFFFF" fill-opacity=".035"/>
    <rect x="56" y="616" width="688" height="76" fill="#FFFFFF" fill-opacity=".020"/>
    <rect x="56" y="692" width="688" height="88" rx="10" fill="#FFFFFF" fill-opacity=".035"/>
  </g>

  <!-- Astil-role backgrounds -->
  <rect x="430" y="189" width="313" height="86" rx="9" fill="url(#stack-fill)"/>
  <rect x="430" y="277" width="313" height="86" fill="url(#stack-fill)"/>
  <rect x="430" y="365" width="313" height="86" fill="url(#stack-fill)"/>
  <rect x="430" y="453" width="313" height="74" fill="#FF3333" fill-opacity=".045"/>
  <rect x="430" y="529" width="313" height="86" fill="url(#local-fill)"/>
  <rect x="430" y="617" width="313" height="74" fill="#A3F5A3" fill-opacity=".12"/>

  <!-- Column separators -->
  <line x1="166" y1="188" x2="166" y2="780" stroke="#4D4D4D" stroke-width="2"/>
  <line x1="430" y1="188" x2="430" y2="780" stroke="#4D4D4D" stroke-width="2"/>

  <!-- Register ranges -->
  <g fill="#FFFFFF"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="18" font-weight="700" text-anchor="middle">
    <text x="111" y="239">x0 … x7</text>
    <text x="111" y="327">x8 … x15</text>
    <text x="111" y="415">x16 x17</text>
    <text x="111" y="497" fill="#FF6666">x18</text>
    <text x="111" y="579">x19 … x27</text>
    <text x="111" y="663">x28</text>
    <text x="111" y="735">x29 x30</text>
    <text x="111" y="758">x31</text>
  </g>

  <!-- ABI roles -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     text-anchor="middle">
    <text x="298" y="224" fill="#FFFFFF" font-size="18">input/output params</text>
    <text x="298" y="250" fill="#A8A8F0" font-size="14">volatile</text>

    <text x="298" y="312" fill="#FFFFFF" font-size="18"><tspan fill="#A8A8F0">volatile</tspan><tspan> scratch</tspan></text>
    <text x="298" y="338" fill="#A8A8F0" font-size="14">caller-saved</text>

    <text x="298" y="400" fill="#FFFFFF" font-size="18"><tspan fill="#A8A8F0">volatile</tspan><tspan> scratch</tspan></text>
    <text x="298" y="426" fill="#C3C3B6" font-size="14">IP0 / IP1</text>

    <text x="298" y="497" fill="#FF6666" font-size="17">reserved on Apple</text>

    <text x="298" y="565" fill="#FFFFFF" font-size="18">scratch</text>
    <text x="298" y="591" fill="#A8A8F0" font-size="14">callee-saved</text>

    <text x="298" y="650" fill="#FFFFFF" font-size="18">scratch</text>
    <text x="298" y="676" fill="#A8A8F0" font-size="14">callee-saved</text>

    <text x="298" y="724" fill="#FFFFFF" font-size="17">FP · LR</text>
    <text x="298" y="751" fill="#C3C3B6" font-size="14">SP or ZR</text>
  </g>

  <!-- Astil roles -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     text-anchor="middle">
    <text x="587" y="224" fill="#FFFFFF" font-size="18">stack + locals</text>
    <text x="587" y="250" fill="#C3C3B6" font-size="14">input/output params</text>

    <text x="587" y="312" fill="#FFFFFF" font-size="18">stack + locals</text>
    <text x="587" y="338" fill="#A8A8F0" font-size="14">only inside words</text>

    <text x="587" y="400" fill="#FFFFFF" font-size="18">stack + locals</text>
    <text x="587" y="426" fill="#A8A8F0" font-size="14">only inside words</text>

    <text x="587" y="497" fill="#FF6666" font-size="17">unused</text>

    <text x="587" y="565" fill="#FFFFFF" font-size="18">spilled locals</text>
    <text x="587" y="591" fill="#A8A8F0" font-size="14">save / restore</text>

    <text x="587" y="650" fill="#A3F5A3" font-size="18">context address</text>
    <text x="587" y="676" fill="#C3C3B6" font-size="14">allocator + program-defined</text>

    <text x="587" y="737" fill="#C3C3B6" font-size="17">architectural roles</text>
  </g>

  <!-- Consequences -->
  <line x1="56" y1="820" x2="744" y2="820" stroke="#333333" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">
    <circle cx="66" cy="858" r="5" fill="#66FFE6"/>
    <text x="84" y="865" fill="#FFFFFF">inside words, x0…x17 hold stack values and locals</text>

    <circle cx="66" cy="900" r="5" fill="#A8A8F0"/>
    <text x="84" y="907" fill="#FFFFFF">x19…x27 = extra locals; prologue/epilogue cost</text>

    <circle cx="66" cy="942" r="5" fill="#A3F5A3"/>
    <text x="84" y="949" fill="#FFFFFF">x28 context: bump allocator header + extra state; JIT main thread: interpreter object</text>
  </g>
</svg>
