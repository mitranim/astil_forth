<svg width="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"
     role="img" style="background:#181A1B" xmlns="http://www.w3.org/2000/svg">
  <title>Load replaces address; store consumes value and address</title>
  <desc>
    Comptime load selects the top register as an address, loads memory into
    that same register, and leaves argument length unchanged. Comptime store
    selects the second-top register as value and top register as address,
    writes the value to memory, and reduces argument length by two. Both words
    ask the outer compiler for current slots and tell it which instruction and
    resulting argument length to record.
  </desc>

  <defs>
    <linearGradient id="live-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66FFE6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66FFE6" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="load-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3F5A3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A3F5A3" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="store-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8A8F0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A8A8F0" stop-opacity=".025"/>
    </linearGradient>
    <marker id="arrow-load" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A3F5A3"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-store" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8A8F0"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#181A1B"/>

  <text x="48" y="70" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="36" font-weight="700">
    Load replaces address; store consumes value and address
  </text>

  <!-- Load panel. -->
  <rect x="48" y="108" width="568" height="514" rx="16"
        fill="url(#load-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="76" y="151" fill="#A3F5A3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">COMPTIME @</text>
  <text x="76" y="184" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21" font-weight="700">Memory replaces top address in same slot</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- Input stack and memory. -->
    <text x="76" y="226" fill="#C3C3B6" font-size="14">BEFORE</text>
    <rect x="76" y="241" width="145" height="64" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="221" y="241" width="145" height="64" rx="8"
          fill="url(#live-fill)" stroke="#A3F5A3" stroke-width="2"/>
    <text x="90" y="280" fill="#C3C3B6" font-size="14">x0</text>
    <text x="207" y="280" fill="#FFFFFF" text-anchor="end" font-size="18">keep</text>
    <text x="235" y="280" fill="#A3F5A3" font-size="14">x1</text>
    <text x="352" y="280" fill="#FFFFFF" text-anchor="end" font-size="18">adr</text>

    <path d="M433 273H386" fill="none" stroke="#A3F5A3"
          stroke-width="2.4" marker-end="url(#arrow-load)"/>
    <text x="410" y="255" fill="#A3F5A3" text-anchor="middle" font-size="13">load</text>
    <rect x="450" y="230" width="138" height="86" rx="10"
          fill="#FFFFFF" fill-opacity=".045" stroke="#A3F5A3"/>
    <text x="519" y="259" fill="#A3F5A3" text-anchor="middle" font-size="14">MEMORY</text>
    <text x="519" y="292" fill="#FFFFFF" text-anchor="middle" font-size="17">[adr] = val</text>

    <!-- Output stack. -->
    <text x="76" y="356" fill="#C3C3B6" font-size="14">AFTER</text>
    <rect x="76" y="371" width="145" height="60" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="221" y="371" width="145" height="60" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <text x="90" y="408" fill="#C3C3B6" font-size="14">x0</text>
    <text x="207" y="408" fill="#FFFFFF" text-anchor="end" font-size="18">keep</text>
    <text x="235" y="408" fill="#C3C3B6" font-size="14">x1</text>
    <text x="352" y="408" fill="#FFFFFF" text-anchor="end" font-size="18">val</text>

    <!-- Compiler negotiation. -->
    <rect x="76" y="465" width="512" height="112" rx="9"
          fill="#FFFFFF" fill-opacity=".035"/>
    <text x="98" y="497" fill="#A3F5A3" font-size="14">ASK</text>
    <text x="150" y="497" fill="#FFFFFF" font-size="14">arg_len 2 → adr x1</text>
    <text x="98" y="530" fill="#A3F5A3" font-size="14">TELL</text>
    <text x="158" y="530" fill="#FFFFFF" font-size="14">load x1,[x1]</text>
    <text x="98" y="560" fill="#C3C3B6" font-size="14">arg_len stays 2</text>
  </g>

  <!-- Store panel. -->
  <rect x="664" y="108" width="568" height="514" rx="16"
        fill="url(#store-fill)" stroke="#4D4D4D" stroke-width="2"/>
  <text x="692" y="151" fill="#A8A8F0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="19" font-weight="700">COMPTIME <tspan fill="#A3F5A3">!</tspan></text>
  <text x="692" y="184" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="21" font-weight="700">Value flows to memory; both inputs consumed</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- Input stack and memory. -->
    <text x="692" y="226" fill="#C3C3B6" font-size="14">BEFORE</text>
    <rect x="692" y="241" width="102" height="64" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="794" y="241" width="102" height="64"
          fill="url(#live-fill)" stroke="#A8A8F0" stroke-width="2"/>
    <rect x="896" y="241" width="102" height="64" rx="8"
          fill="url(#live-fill)" stroke="#A8A8F0" stroke-width="2"/>
    <text x="704" y="280" fill="#C3C3B6" font-size="13">x0</text>
    <text x="782" y="280" fill="#FFFFFF" text-anchor="end" font-size="17">keep</text>
    <text x="806" y="280" fill="#A8A8F0" font-size="13">x1</text>
    <text x="884" y="280" fill="#FFFFFF" text-anchor="end" font-size="17">val</text>
    <text x="908" y="280" fill="#A8A8F0" font-size="13">x2</text>
    <text x="986" y="280" fill="#FFFFFF" text-anchor="end" font-size="17">adr</text>

    <path d="M1014 273H1050" fill="none" stroke="#A8A8F0"
          stroke-width="2.4" marker-end="url(#arrow-store)"/>
    <text x="1032" y="255" fill="#A8A8F0" text-anchor="middle" font-size="13">store</text>
    <rect x="1066" y="230" width="138" height="86" rx="10"
          fill="#FFFFFF" fill-opacity=".045" stroke="#A8A8F0"/>
    <text x="1135" y="259" fill="#A8A8F0" text-anchor="middle" font-size="14">MEMORY</text>
    <text x="1135" y="292" fill="#FFFFFF" text-anchor="middle" font-size="17">[adr] ← val</text>

    <!-- Output stack and physical residue. -->
    <text x="692" y="356" fill="#C3C3B6" font-size="14">AFTER</text>
    <rect x="692" y="371" width="102" height="60" rx="8"
          fill="url(#live-fill)" stroke="#66FFE6"/>
    <rect x="804" y="371" width="92" height="60" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
    <rect x="906" y="371" width="92" height="60" rx="8"
          fill="#FFFFFF" fill-opacity=".025" stroke="#4D4D4D"/>
    <text x="704" y="408" fill="#C3C3B6" font-size="13">x0</text>
    <text x="782" y="408" fill="#FFFFFF" text-anchor="end" font-size="17">keep</text>
    <text x="816" y="408" fill="#666666" font-size="13">x1</text>
    <text x="884" y="408" fill="#777777" text-anchor="end" font-size="17">val</text>
    <text x="918" y="408" fill="#666666" font-size="13">x2</text>
    <text x="986" y="408" fill="#777777" text-anchor="end" font-size="17">adr</text>

    <!-- Compiler negotiation. -->
    <rect x="692" y="465" width="512" height="112" rx="9"
          fill="#FFFFFF" fill-opacity=".035"/>
    <text x="714" y="495" fill="#A8A8F0" font-size="14">ASK</text>
    <text x="766" y="495" fill="#FFFFFF" font-size="14">arg_len 3 → val x1 · adr x2</text>
    <text x="714" y="528" fill="#A8A8F0" font-size="14">TELL</text>
    <text x="774" y="528" fill="#FFFFFF" font-size="14">store x1,[x2]</text>
    <text x="714" y="558" fill="#C3C3B6" font-size="14">set arg_len 1</text>
  </g>

  <text x="640" y="684" fill="#C3C3B6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17">
    Selected stack slots may require local relocation first
  </text>
</svg>
